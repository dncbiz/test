:root {
  --navy:#002c5f;
  --blue:#00aad2;
  --cyan:#61e7ff;
  --danger:#ff4a45;
  --amber:#ffba45;
  --safe:#20d495;
  --ink:#07131f;
  --panel:#04111edb
}

* {
  box-sizing:border-box
}

html,body {
  background:#06111b;
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden
}

body {
  color:#fff;
  font-family:Arial,Noto Sans KR,sans-serif
}

button,a {
  font:inherit
}

button {
  cursor:pointer
}

.game-shell {
  color:#fff;
  background:#07131f;
  word-break:keep-all;
  overflow-wrap:break-word;
  grid-template-rows:68px minmax(0,1fr);
  width:100vw;
  height:100dvh;
  min-height:620px;
  display:grid;
  position:relative;
  overflow:hidden
}

.game-topbar {
  z-index:40;
  background:#020e1bf7;
  border-bottom:1px solid #8ecbe738;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  padding:0 26px;
  display:grid;
  position:relative;
  box-shadow:0 8px 30px #0000002e
}

.experience-title {
  grid-column:2;
  justify-self:center;
  margin:0;
  color:#fff;
  letter-spacing:-.035em;
  font-size:20px;
  font-weight:700;
  white-space:nowrap
}

.header-reset {
  grid-column:3;
  justify-self:end;
  color:#b9cad4;
  border:1px solid #8ecbe738;
  border-radius:50%;
  background:#061522c7;
  place-items:center;
  width:40px;
  height:40px;
  font-size:20px;
  line-height:1;
  transition:color .2s,border-color .2s,background .2s;
  display:grid
}

.header-reset:hover {
  color:#fff;
  border-color:var(--cyan);
  background:#07304a
}

.game-stage {
  --ceiling-depth-height:clamp(68px,9.5vh,110px);
  isolation:isolate;
  background:linear-gradient(180deg,#9ea3a4 0%,#929a9d 58%,#758187 100%);
  min-height:0;
  position:relative;
  overflow:hidden
}

.game-video {
  object-fit:cover;
  object-position:center 48%;
  filter:saturate(.86)contrast(1.05)brightness(.84);
  -webkit-user-select:none;
  user-select:none;
  width:100%;
  height:100%;
  position:absolute;
  top:0;
  bottom:0;
  left:0;
  right:0
}

/* PC 가로 화면: 테일게이트 상단은 남기고 차량을 위로 올려 하단 노출을 확보합니다. */
@media (min-width:1021px) and (orientation:landscape) {
  .game-video {
    object-position:center 54.5%
  }
}

.stage-grade {
  pointer-events:none;
  background:linear-gradient(90deg,#001222b3,#0000 25% 66%,#00101e85),linear-gradient(#02111e4d,#0000 28% 70%,#000c1894);
  position:absolute;
  top:0;
  bottom:0;
  left:0;
  right:0
}

.stage-grid {
  opacity:.14;
  pointer-events:none;
  background-image:linear-gradient(#85e4ff52 1px,#0000 1px),linear-gradient(90deg,#85e4ff52 1px,#0000 1px);
  background-size:8vw 8vw;
  position:absolute;
  top:0;
  bottom:0;
  left:0;
  right:0;
  -webkit-mask-image:linear-gradient(90deg,#000,#0000 34% 72%,#000);
  mask-image:linear-gradient(90deg,#000,#0000 34% 72%,#000)
}

.scan-line {
  opacity:0;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);
  height:2px;
  box-shadow:0 0 16px var(--cyan);
  pointer-events:none;
  position:absolute;
  top:-2px;
  left:0;
  right:0
}

.phase-opening .scan-line,.phase-reopening .scan-line {
  opacity:.65;
  animation:2.2s linear infinite scanDown
}

@keyframes scanDown {
  to {
    transform:translateY(calc(100dvh - 140px))
  }

}

.radar-zone {
  z-index:15;
  opacity:0;
  pointer-events:none;
  background:radial-gradient(at 60% 70%,#24cdff2e,#0000 66%);
  border:1px dashed #61e7ffb3;
  border-radius:48% 52% 43% 57%;
  width:28%;
  height:68%;
  transition:opacity .55s ease,border-color .25s,background .25s,box-shadow .25s;
  position:absolute;
  top:13%;
  left:20%
}

.radar-zone.visible {
  opacity:1
}

.radar-zone:before,.radar-zone:after {
  content:"";
  border-radius:inherit;
  border:1px solid #61e7ff70;
  animation:1.8s infinite zonePulse;
  position:absolute;
  top:13%;
  bottom:13%;
  left:13%;
  right:13%
}

.radar-zone:after {
  animation-delay:.3s;
  top:28%;
  bottom:28%;
  left:28%;
  right:28%
}

.radar-zone>i {
  border:2px solid #0000;
  border-top-color:var(--cyan);
  filter:drop-shadow(0 0 5px var(--cyan));
  border-radius:50%;
  animation:1.5s infinite radarArc;
  position:absolute;
  bottom:14%;
  left:52%;
  transform:translate(-50%)
}

.radar-zone>i:first-child {
  width:34%;
  height:20%
}

.radar-zone>i:nth-child(2) {
  width:60%;
  height:34%;
  animation-delay:.16s
}

.radar-zone>i:nth-child(3) {
  width:86%;
  height:50%;
  animation-delay:.32s
}

.radar-zone>span {
  white-space:nowrap;
  color:#bdf7ff;
  letter-spacing:-.02em;
  background:#002037ad;
  border:1px solid #8eeaff38;
  border-radius:999px;
  padding:8px 14px;
  font-size:11px;
  font-weight:600;
  line-height:1.2;
  position:absolute;
  top:0;
  left:50%;
  transform:translate(-50%,-50%)
}

@keyframes zonePulse {
  50% {
    opacity:.15;
    transform:scale(1.035)
  }

}

@keyframes radarArc {
  50% {
    opacity:.2
  }

}

.obstacle-inside .radar-zone {
  border-color:var(--danger);
  background:radial-gradient(at 60% 70%,#ff4a4542,#0000 67%);
  animation:.52s infinite alternate dangerFlash
}

.obstacle-inside .radar-zone:before,.obstacle-inside .radar-zone:after,.obstacle-inside .radar-zone>i {
  border-top-color:var(--danger);
  border-color:#ff4a4585
}

.obstacle-inside .radar-zone>span {
  background:var(--danger);
  border-color:#ffffff42;
  color:#fff
}


.ceiling-depth {
  z-index:12;
  pointer-events:none;
  background:
    radial-gradient(ellipse at 50% -20%,#d3d8da42 0%,#8e999f26 34%,#0000 68%),
    linear-gradient(180deg,#17232b 0%,#2d3941 28%,#505a60 67%,#747b7e 100%);
  border-bottom:1px solid #d6e1e65c;
  height:var(--ceiling-depth-height);
  position:absolute;
  top:0;
  left:0;
  right:0;
  box-shadow:inset 0 -18px 28px #111b2238,0 16px 30px #0c141a2e
}

.ceiling-depth:before {
  content:"";
  opacity:.52;
  background:
    linear-gradient(116deg,#ffffff12 0 1px,#0000 1px 28%,#0000001c 28% 28.4%,#0000 28.4% 72%,#ffffff0d 72% 72.4%,#0000 72.4%),
    linear-gradient(90deg,#00000026,#ffffff12 50%,#0000002b);
  clip-path:polygon(0 0,100% 0,96% 100%,4% 100%);
  position:absolute;
  inset:0
}

.ceiling-depth:after {
  content:"";
  background:linear-gradient(90deg,#0008,#0000 20% 80%,#0007);
  position:absolute;
  inset:0
}

.ceiling-obstacle {
  z-index:17;
  pointer-events:none;
  width:clamp(80px,6.5vw,130px);
  aspect-ratio:600/449;
  position:absolute;
  top:calc(var(--ceiling-depth-height) - 1px);
  left:25%;
  transform:translateX(-50%);
  filter:drop-shadow(0 9px 10px #0008)
}

.ceiling-obstacle:before {
  display:none
}

.ceiling-obstacle img {
  object-fit:contain;
  object-position:center top;
  width:100%;
  height:100%;
  display:block;
  filter:drop-shadow(0 0 1px #ffffffa6)drop-shadow(0 4px 6px #000a)
}

@keyframes dangerFlash {
  to {
    box-shadow:inset 0 0 60px #ff25212e,0 0 35px #ff2d2633
  }

}

.experience-hud {
  z-index:30;
  pointer-events:none;
  flex-direction:column;
  gap:8px;
  width:min(520px,calc(100% - 32px));
  display:flex;
  position:absolute;
  bottom:18px;
  left:50%;
  transform:translate(-50%)
}

.experience-stepper {
  pointer-events:none;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  min-height:24px;
  padding:0 10px 2px;
  display:flex
}

.experience-stepper>div {
  color:#6f8290;
  align-items:center;
  gap:6px;
  display:flex;
  transition:color .25s
}

.experience-stepper>div span {
  color:#718392;
  background:#04111dbd;
  border:1px solid #819db04d;
  border-radius:50%;
  place-items:center;
  width:24px;
  height:24px;
  font-size:10px;
  font-weight:800;
  display:grid;
  transition:color .25s,border-color .25s,background .25s,box-shadow .25s
}

.experience-stepper>div small {
  white-space:nowrap;
  font-size:12px;
  font-weight:650
}

.experience-stepper>i {
  background:#7e9eb43b;
  flex:0 1 26px;
  width:26px;
  height:1px;
  display:block;
  transition:background .25s,box-shadow .25s
}

.experience-stepper>div.active {
  color:#c9eaff
}

.experience-stepper>div.active span {
  color:#fff;
  background:#286fff;
  border-color:#67b2ff;
  box-shadow:0 0 10px #2d7dff80
}

.experience-stepper>div.current span {
  box-shadow:0 0 0 4px #287cff1f,0 0 14px #2d7dffad
}

.experience-stepper>i.active {
  background:linear-gradient(90deg,#367cff,#62dfff);
  box-shadow:0 0 7px #45bfff59
}

.status-toast {
  -webkit-backdrop-filter:blur(16px);

.clearance-countdown {

  inset:2px;
  -webkit-mask:radial-gradient(farthest-side,#0000 calc(100% - 6.4px),#000 calc(100% - 5.6px));

}

.clearance-countdown.expired>strong span {

}

.drag-obstacle {
  z-index:18;
  color:#fff;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
  cursor:grab;
  filter:drop-shadow(0 14px 14px #0000004d);
  background:0 0;
  border:0;
  place-items:center;
  width:112px;
  height:112px;
  padding:0;
  transition:filter .18s;
  display:grid;
  position:absolute;
  transform:translate(-50%,-50%)
}

.drag-obstacle.person {
  width:var(--person-width,140px);
  height:var(--person-height,300px)
}

.drag-obstacle .person-graphic {
  width:100%;
  height:100%;
  display:block;
  position:relative;
  transform:translateY(-2%)
}

.person-graphic img {
  pointer-events:none;
  -webkit-user-select:none;
  user-select:none;
  object-fit:contain;
  max-width:none;
  width:100%;
  height:100%;
  display:block;
  position:absolute;
  inset:0;
  filter:drop-shadow(0 0 1px #f5fbffde)drop-shadow(0 0 6px #8edcf080)drop-shadow(0 12px 9px #00000099);
  transition:filter .18s
}

.obstacle-inside .person-graphic img {
  filter:drop-shadow(0 0 1px #fff7f5e6)drop-shadow(0 0 6px #ff746d80)drop-shadow(0 12px 9px #000000a6)
}

.drag-obstacle.person:before {
  display:none
}

.drag-obstacle.person:after {
  background:transparent;
  box-shadow:none
}

.drag-obstacle.locked {
  cursor:default
}

.drag-obstacle.locked:hover {
  filter:drop-shadow(0 14px 14px #0000004d)
}

.drag-obstacle.obstacle-flying {
  transition:filter .18s;
  filter:drop-shadow(-18px 10px 15px #0000004a)drop-shadow(0 0 13px #61e7ff66)
}

.drag-obstacle.obstacle-flying:before {
  animation-duration:.7s
}

.drag-obstacle:active {
  cursor:grabbing
}

.drag-obstacle:focus-visible {
  outline:2px solid var(--cyan);
  outline-offset:5px
}

.drag-obstacle:before {
  content:"";
  opacity:.62;
  border:1px dashed #ffffff75;
  border-radius:50%;
  animation:8s linear infinite objectOrbit;
  position:absolute;
  top:4px;
  bottom:4px;
  left:4px;
  right:4px
}

.drag-obstacle:after {
  content:"";
  z-index:-1;
  background:#0020361f;
  border-radius:50%;
  position:absolute;
  top:14px;
  bottom:14px;
  left:14px;
  right:14px;
  box-shadow:0 0 26px #61e7ff26
}

.drag-obstacle:hover {
  filter:drop-shadow(0 18px 18px #0000006b)drop-shadow(0 0 10px #61e7ff7a)
}

.obstacle-inside .drag-obstacle {
  filter:drop-shadow(0 0 15px var(--danger)) drop-shadow(0 14px 14px #00000073)
}

.obstacle-inside .drag-obstacle:before {
  border-color:var(--danger);
  animation-duration:1.3s
}

@keyframes objectOrbit {
  to {
    transform:rotate(360deg)
  }

}

.drag-pulse {
  z-index:3;
  pointer-events:none;
  box-sizing:border-box;
  width:clamp(20px,calc(var(--person-width,140px) * .22),32px);
  height:clamp(20px,calc(var(--person-width,140px) * .22),32px);
  border:1.6px solid #65dcff;
  border-radius:50%;
  background:#071a28eb;
  box-shadow:0 0 0 4px #3c94ff1f,0 0 12px #4bcfffcc,inset 0 1px #ffffff38;
  animation:1.15s ease-in-out infinite dragPointBreath;
  position:absolute;
  top:31%;
  left:50%;
  transform:translate(-50%,-50%)
}

.drag-pulse:before {
  content:"";
  border:1.4px solid #66ddff;
  border-radius:50%;
  position:absolute;
  inset:-5px;
  animation:1.35s ease-out infinite dragPointRipple
}

.drag-pulse:after {
  content:"";
  background:#e9fbff;
  border-radius:50%;
  width:28%;
  height:28%;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 7px #65dcff
}

@keyframes dragPointBreath {
  50% {
    box-shadow:0 0 0 5px #3c94ff26,0 0 16px #4bcfffe0,inset 0 1px #ffffff38
  }
}

@keyframes dragPointRipple {
  0% {
    opacity:.55;
    transform:scale(.72)
  }

  75%,to {
    opacity:0;
    transform:scale(1.55)
  }

}

 */

const VIDEO_POSTER = "./sourcefilm-poster.png";

const OBSTACLE_POSITIONS = {
  desktop: {
    start: { x: 5, y: 65 },
    detected: { x: 33, y: 65 },
  },
  mobile: {
    start: { x: 10, y: 31 },
    detected: { x: 30, y: 31 },
  },
};
const COUNTDOWN_SECONDS = 3; // 화면에 표시되는 카운트
const COUNTDOWN_REAL_SECONDS = 6; // 실제 카운트 진행 시간(초)
const REAR_DETECTION_PROGRESS = 30;
const CEILING_DETECTION_PROGRESS = 66;
const OBSTACLE_FLIGHT_DURATION_MS = 801;
const MOBILE_LAYOUT_MAX_WIDTH = 800;
const LANDSCAPE_PERSON_Y_OFFSET = 13; // 가로형 화면에서 아래로 내릴 비율(%)
// Keep the person on the same horizontal scale as the source video.
// Both the responsive correction and final size depend only on stage width.
const PERSON_SCALE = {
  mobileWidth: 390,
  desktopWidth: 1920,
  mobileHeightRatio: 0.43,
  desktopHeightRatio: 0.37,
};

function obstaclePosition(name) {
  const stage = document.querySelector(".game-stage");
  const stageBounds = stage?.getBoundingClientRect();
  const aspectRatio = stageBounds?.height
    ? stageBounds.width / stageBounds.height
    : window.innerWidth / window.innerHeight;
  const desktopMix = Math.max(0, Math.min(1, (aspectRatio - 0.72) / 0.58));
  const mobile = OBSTACLE_POSITIONS.mobile[name];
  const desktop = OBSTACLE_POSITIONS.desktop[name];
  const mobileY = mobile.y + (desktop.y - mobile.y) * desktopMix;
  const usesDesktopVideoAlignment = window.matchMedia(
    `(min-width:${MOBILE_LAYOUT_MAX_WIDTH + 1}px)`,
  ).matches;
  const usesLandscapePersonOffset = window.matchMedia(
    `(min-width:${MOBILE_LAYOUT_MAX_WIDTH + 1}px) and (orientation:landscape)`,
  ).matches;
  const alignedY = usesDesktopVideoAlignment ? desktop.y : mobileY;

  return {
    x: mobile.x + (desktop.x - mobile.x) * desktopMix,
    // The video drops from top:-30% to top:0 at 801px. Match that jump.
    y: alignedY + (usesLandscapePersonOffset ? LANDSCAPE_PERSON_Y_OFFSET : 0),
  };
}

              <span class="radar-dot">◉</span>
              <div><strong>테일게이트 장애물 감지 보조</strong><small>출고 시 기본 OFF</small></div>
              <i class="switch"><b></b></i>
            </button>
            <p class="setting-help"><b>i</b> 파워 테일게이트 열림 중 후방·천장 장애물을 감지하면 자동으로 멈춥니다.</p>
          </div>
        </div>
      </section>

      <section class="setting-confirm" role="alertdialog" aria-modal="true" hidden>
        <span class="confirm-icon">!</span>
        <small>기능 활성화</small>
        <h2>감지 보조를 켤까요?</h2>
        <p>이 기능은 테일게이트가 열릴 때 주변의 장애물을 감지하고 충돌하지 않도록 도와줍니다. 주변 환경과 장애물 조건에 따라 감지하지 못할 수 있으니, 테일게이트를 열기 전 반드시 주변 안전을 직접 확인하세요.</p>
        <div><span>✓ 충돌 위험 시 자동 정지</span><span>✓ 안전 확인 시 자동 재열림</span></div>
        <footer>
          <button type="button" data-action="hide-confirm">취소</button>
          <button type="button" data-action="activate">확인하고 켜기</button>
        </footer>
      </section>
    </div>

  </main>
`;

const elements = {
  shell: root.querySelector(".game-shell"),
  stage: root.querySelector("[data-stage]"),
  video: root.querySelector(".game-video"),
  radarZone: root.querySelector(".radar-zone"),
  radarLabel: root.querySelector("[data-radar-label]"),
  ceilingDepth: root.querySelector(".ceiling-depth"),
  ceilingObstacle: root.querySelector(".ceiling-obstacle"),
  safeZone: root.querySelector(".safe-zone"),
  dragLabel: root.querySelector(".drag-label"),
  status: root.querySelector(".status-toast"),
  countdown: root.querySelector(".clearance-countdown"),
  countdownValue: root.querySelector("[data-countdown-value]"),
  stepper: root.querySelector("[data-experience-stepper]"),
  stepperItems: [...root.querySelectorAll("[data-experience-step]")],
  stepperLines: [...root.querySelectorAll("[data-experience-stepper] > i")],
  obstacle: root.querySelector(".drag-obstacle"),
  dragPulse: root.querySelector(".drag-pulse"),
  intro: root.querySelector(".intro-overlay"),
  scenarioSelect: root.querySelector(".scenario-select-overlay"),
  settings: root.querySelector(".settings-overlay"),
  confirm: root.querySelector(".setting-confirm"),
  openButton: root.querySelector('[data-action="open"]'),
  retryButton: root.querySelector('[data-action="retry"]'),
  replayButton: root.querySelector('[data-action="replay"]'),
};

function objectGraphicMarkup(type) {
  if (type === "person") {
    return '<img src="./sourceperson.png" alt="" draggable="false">';
  }

  if (type === "cart") {
    return "<i></i><span></span><b></b><b></b>";
  }

  if (type === "luggage") {
    return "<i></i><span></span><b></b><b></b>";
  }

  return "<i></i><span>H</span>";
}

function renderObjectGraphic(holder, type) {
  holder.className = `${type}-graphic`;
  holder.innerHTML = objectGraphicMarkup(type);
}

function setHidden(element, shouldHide) {
  element.hidden = shouldHide;
}

function isActiveMovement() {
  return ["opening", "stopped", "reopening"].includes(app.phase);
}

function isExperienceVisible() {
  return !["intro", "scenario", "settings"].includes(app.phase);
}

function setPhase(nextPhase) {
  clearStopCountdown();
  if (nextPhase !== "ceilingStopped") clearCeilingRadarTimeout();
  app.phase = nextPhase;
  updateInterface();

  if (nextPhase === "stopped" && !app.countdownExpired) {
    startStopCountdown();
  }
}

function experienceStepForPhase(phase, holdComplete) {
  if (phase === "armed") return 1;
  if (phase === "ceilingStopped") return 3;
  if (phase === "opening" || phase === "stopped" || phase === "missed") {
    return 2;
  }
  if (phase === "reopening" || phase === "success") return 3;
  return 1;
}

function updateExperienceStepper(phase, holdComplete) {
  const currentStep = experienceStepForPhase(phase, holdComplete);
  const labels = app.scenarioMode === "ceiling"
    ? ["기능 활성화 완료", "천장 감지 완료", "자동 멈춤 완료"]
    : ["기능 활성화 완료", "자동 멈춤 완료", "재열림 완료"];

  elements.stepperItems.forEach((item, index) => {
    const step = Number(item.dataset.experienceStep);
    item.querySelector("small").textContent = labels[index];
    item.classList.toggle("active", step <= currentStep);
    item.classList.toggle("current", step === currentStep);
    if (step === currentStep) item.setAttribute("aria-current", "step");
    else item.removeAttribute("aria-current");
  });

  elements.stepperLines.forEach((line, index) => {
    line.classList.toggle("active", index + 1 < currentStep);
  });
}

function updateInterface() {
  const phase = app.phase;
  const rearScenario = app.scenarioMode === "rear";
  const experienceVisible = isExperienceVisible();
  const movementActive = isActiveMovement();
  const holdComplete = rearScenario && phase === "stopped" && app.countdownExpired;
  const ceilingStopped = !rearScenario && phase === "ceilingStopped";
  const obstacleDetected = ceilingStopped || (phase === "stopped" && app.obstacleInside);
  const radarVisible = (movementActive && !holdComplete) ||
    (ceilingStopped && !app.ceilingRadarExpired);
  const statusMessage = app.scenarioMode === "ceiling"
    ? CEILING_STATUS_MESSAGES[phase]
    : STATUS_MESSAGES[phase];

  elements.shell.className = `game-shell scenario-${app.scenarioMode} phase-${phase}${obstacleDetected ? " obstacle-inside" : ""}${holdComplete ? " countdown-expired" : ""}`;
  setHidden(elements.intro, phase !== "intro");
  setHidden(elements.scenarioSelect, phase !== "scenario");
  setHidden(elements.settings, phase !== "settings");
  setHidden(elements.stepper, !experienceVisible);
  setHidden(elements.obstacle, !experienceVisible || !rearScenario);
  setHidden(elements.ceilingDepth, !experienceVisible || rearScenario);
  setHidden(elements.ceilingObstacle, !experienceVisible || rearScenario);
  setHidden(elements.status, !statusMessage);
  setHidden(elements.countdown, !rearScenario || phase !== "stopped" || holdComplete);
  setHidden(elements.openButton, phase !== "armed");
  setHidden(elements.retryButton, phase !== "missed" && !holdComplete && !ceilingStopped);
  setHidden(elements.replayButton, phase !== "success");
  setHidden(elements.dragPulse, !rearScenario || !(phase === "stopped" && !app.countdownExpired));
  setHidden(elements.dragLabel, !rearScenario || !(phase === "stopped" && !app.countdownExpired));
  setHidden(elements.safeZone, !rearScenario || !(phase === "stopped" && !app.countdownExpired));
  elements.radarLabel.textContent = rearScenario
    ? "RADAR 감지 영역 (FoV)"
    : "천장 장애물 감지 보조 작동 중";
  elements.radarZone.classList.toggle("visible", radarVisible);
  updateExperienceStepper(phase, holdComplete);
  updateStatus();
  updateCountdown();
  updateObjectControls();
}

function updateStatus() {
  const rearScenario = app.scenarioMode === "rear";
  const status = rearScenario && app.phase === "stopped" && app.countdownExpired
    ? {
        title: "테일게이트 자동 멈춤 유지",
        tone: "missed",
      }
    : rearScenario
      ? STATUS_MESSAGES[app.phase]
      : CEILING_STATUS_MESSAGES[app.phase];
  if (!status) return;

  const guidance = rearScenario && app.phase === "stopped" && app.countdownExpired
    ? "3초 이내 충돌 안전이 확보되지 않아 테일게이트가 멈춤 상태를 유지합니다."
    : rearScenario
      ? GUIDANCE_MESSAGES[app.phase] || ""
      : CEILING_GUIDANCE_MESSAGES[app.phase] || "";

  elements.status.className = `status-toast ${status.tone}`;
  root.querySelector("[data-status-title]").textContent = status.title;
  root.querySelector("[data-status-guidance]").textContent = guidance;
}

function updateCountdown() {
  if (app.phase !== "stopped") return;

  const remaining = Math.max(0, app.countdownRemaining);
  const progress = app.countdownExpired
    ? 0
    : Math.max(0, Math.min(1, remaining / COUNTDOWN_SECONDS));
  elements.countdown.classList.toggle("expired", app.countdownExpired);
  elements.countdown.style.setProperty("--countdown-progress", `${progress * 360}deg`);
  elements.countdownValue.textContent = app.countdownExpired
    ? "0"
    : String(Math.max(1, Math.ceil(remaining)));
  elements.countdown.setAttribute(
    "aria-label",
    app.countdownExpired
      ? "자동 재열림 제한 시간 종료"
      : `자동 재열림 카운트다운 ${Math.max(1, Math.ceil(remaining))}초`,
  );
}

function updateObjectControls() {
  const obstacleFlying = elements.obstacle.classList.contains("obstacle-flying");
  const canDrag = ["stopped", "reopening"].includes(app.phase) && !obstacleFlying;
  renderObjectGraphic(root.querySelector("[data-drag-graphic]"), app.objectType);

  elements.obstacle.className = `drag-obstacle ${app.objectType}${canDrag ? "" : " locked"}${obstacleFlying ? " obstacle-flying" : ""}`;
  elements.obstacle.style.left = `${app.position.x}%`;
  elements.obstacle.style.top = `${app.position.y}%`;
  elements.obstacle.setAttribute(
    "aria-label",
    "사람 실루엣 드래그. 방향키로도 이동 가능",
  );
  syncObstacleToVideo();
}

function updateObstaclePosition() {
  elements.obstacle.style.left = `${app.position.x}%`;
  elements.obstacle.style.top = `${app.position.y}%`;
}

function syncObstacleToVideo() {
  if (app.objectType !== "person") return;

  const stageBounds = elements.stage.getBoundingClientRect();
  if (!stageBounds.width) return;

  const widthMix = Math.max(
    0,
    Math.min(
      1,
      (stageBounds.width - PERSON_SCALE.mobileWidth) /
        (PERSON_SCALE.desktopWidth - PERSON_SCALE.mobileWidth),
    ),
  );
  const personHeightRatio =
    PERSON_SCALE.mobileHeightRatio +
    (PERSON_SCALE.desktopHeightRatio - PERSON_SCALE.mobileHeightRatio) * widthMix;
  const personHeight = stageBounds.width * personHeightRatio;

  elements.obstacle.style.setProperty("--person-height", `${personHeight}px`);
  elements.obstacle.style.setProperty("--person-width", `${personHeight * 0.46}px`);

  if (
    app.positionPreset &&
    !app.dragging &&
    !elements.obstacle.classList.contains("obstacle-flying")
  ) {
    app.position = obstaclePosition(app.positionPreset);
    updateObstaclePosition();
  }
}

function positionIsInsideRadar(position) {
  const stageBounds = elements.stage.getBoundingClientRect();
  const radarBounds = elements.radarZone.getBoundingClientRect();

  if (!stageBounds.width || !stageBounds.height || !radarBounds.width || !radarBounds.height) {
    return false;
  }

  // Use the torso as the interaction hit point, with a small safety margin so
  // the person must visibly clear the FoV before automatic reopening begins.
  const obstacleCenterX = stageBounds.left + (position.x / 100) * stageBounds.width;
  const obstacleCenterY = stageBounds.top + (position.y / 100) * stageBounds.height;
  const safetyMargin = Math.min(12, stageBounds.width * 0.008);

  return (
    obstacleCenterX >= radarBounds.left - safetyMargin &&
    obstacleCenterX <= radarBounds.right + safetyMargin &&
    obstacleCenterY >= radarBounds.top - safetyMargin &&
    obstacleCenterY <= radarBounds.bottom + safetyMargin
  );
}

function moveObstacle(position) {
  app.position = {
    x: Math.max(5, Math.min(94, position.x)),
    y: Math.max(15, Math.min(88, position.y)),
  };
  app.hasDragged = true;
  app.positionPreset = null;
  updateObstaclePosition();
  setHidden(elements.dragPulse, true);

  const isInside = positionIsInsideRadar(app.position);
  if (isInside !== app.obstacleInside) {
    handleObstacleChange(isInside);
  }
}

function handleObstacleChange(isInside) {
  app.obstacleInside = isInside;

  if (isInside && app.phase === "reopening") {
    stopForObstacle();
    return;
  }

  if (!isInside && app.phase === "stopped") {
    const movedInTime = !app.countdownExpired && performance.now() < app.stopDeadline;
    if (movedInTime) {
      resumeTailgate();
    } else {
      app.countdownExpired = true;
      app.countdownRemaining = 0;
      updateInterface();
    }
    return;
  }

  updateInterface();
}

function stopForObstacle() {
  elements.video.pause();
  app.stopCount += 1;
  app.countdownRemaining = COUNTDOWN_SECONDS;
  app.countdownExpired = false;
  app.stopDeadline = performance.now() + COUNTDOWN_REAL_SECONDS * 1000;

  if (!app.detectedOnce) {
    app.detectedOnce = true;
    app.score += 350;
  }

  playTone(190, 0.26, "sawtooth");
  window.setTimeout(() => playTone(145, 0.2, "square"), 90);
  setPhase("stopped");
}

function resumeTailgate() {
  app.score += 200;
  playTone(760, 0.13);
  setPhase("reopening");
  elements.video.play().catch(handleVideoError);
}

function startStopCountdown() {
  clearStopCountdown();
  app.countdownTimer = window.setInterval(() => {
    const realSecondsRemaining = Math.max(0, (app.stopDeadline - performance.now()) / 1000);
    app.countdownRemaining = realSecondsRemaining * (COUNTDOWN_SECONDS / COUNTDOWN_REAL_SECONDS);

    if (app.countdownRemaining <= 0) {
      app.countdownRemaining = 0;
      app.countdownExpired = true;
      clearStopCountdown();
      updateInterface();
      return;
    }

    updateCountdown();
    updateStatus();
  }, 50);
}

function clearStopCountdown() {
  if (app.countdownTimer) window.clearInterval(app.countdownTimer);
  app.countdownTimer = null;
}

function startCeilingRadarTimeout() {
  clearCeilingRadarTimeout();
  app.ceilingRadarExpired = false;
  app.ceilingRadarTimer = window.setTimeout(() => {
    app.ceilingRadarTimer = null;
    if (app.phase !== "ceilingStopped" || app.scenarioMode !== "ceiling") return;
    app.ceilingRadarExpired = true;
    updateInterface();
  }, COUNTDOWN_REAL_SECONDS * 1000);
}

function clearCeilingRadarTimeout() {
  if (app.ceilingRadarTimer) window.clearTimeout(app.ceilingRadarTimer);
  app.ceilingRadarTimer = null;
}

function startExperience() {
  resetAttemptState();
  elements.video.pause();
  elements.video.currentTime = 0;
  setHidden(elements.confirm, true);

  if (app.featureActivated) {
    setPhase("scenario");
    return;
  }

  elements.settings.classList.remove("feature-enabled");
  setPhase("settings");
}

function selectScenario(mode) {
  app.scenarioMode = mode === "ceiling" ? "ceiling" : "rear";
  resetAttemptState();
  elements.video.pause();
  elements.video.currentTime = 0;
  setHidden(elements.confirm, true);
  setPhase(app.featureActivated ? "armed" : "settings");
}

function activateFeature() {
  setHidden(elements.confirm, true);
  elements.settings.classList.add("feature-enabled");
  app.featureActivated = true;
  app.score = 200;
  playTone(660, 0.1);
  window.setTimeout(() => playTone(880, 0.12), 100);
  window.setTimeout(() => setPhase("scenario"), 420);
}

function launchObstacle() {
  const startedAt = performance.now();

  if (app.obstacleFlightFrame) window.cancelAnimationFrame(app.obstacleFlightFrame);
  app.positionPreset = null;
  elements.obstacle.classList.add("obstacle-flying");
  syncObstacleToVideo();

  function animateObstacle(timestamp) {
    if (!["opening", "stopped"].includes(app.phase)) {
      elements.obstacle.classList.remove("obstacle-flying");
      app.obstacleFlightFrame = null;
      return;
    }

    const progress = Math.min(1, (timestamp - startedAt) / OBSTACLE_FLIGHT_DURATION_MS);
    const easedProgress = progress * progress * (3 - 2 * progress);
    const start = obstaclePosition("start");
    const destination = obstaclePosition("detected");
    app.position = {
      x: start.x + (destination.x - start.x) * easedProgress,
      y: start.y + (destination.y - start.y) * easedProgress,
    };
    updateObstaclePosition();

    if (!app.obstacleInside && positionIsInsideRadar(app.position)) {
      app.obstacleInside = true;
      app.positionPreset = null;
      elements.obstacle.classList.remove("obstacle-flying");
      app.obstacleFlightFrame = null;
      stopForObstacle();
      updateObjectControls();
      return;
    }

    if (progress < 1) {
      app.obstacleFlightFrame = window.requestAnimationFrame(animateObstacle);
      return;
    }

    app.positionPreset = "detected";
    app.position = obstaclePosition(app.positionPreset);
    updateObstaclePosition();
    elements.obstacle.classList.remove("obstacle-flying");
    app.obstacleFlightFrame = null;
    updateObjectControls();
  }

  app.obstacleFlightFrame = window.requestAnimationFrame(animateObstacle);
}

function stopForCeilingObstacle() {
  elements.video.pause();
  stopElapsedTimer();
  clearCeilingRadarTimeout();
  app.ceilingRadarExpired = false;
  app.progress = CEILING_DETECTION_PROGRESS;
  app.detectedOnce = true;
  app.stopCount += 1;
  playTone(190, 0.26, "sawtooth");
  window.setTimeout(() => playTone(145, 0.2, "square"), 90);
  setPhase("ceilingStopped");
  startCeilingRadarTimeout();
}

function openTailgate() {
  resetAttemptState();
  app.score = 200;
  app.startedAt = performance.now();
  startElapsedTimer();
  elements.video.currentTime = 0;
  elements.video.muted = true;
  playTone(520, 0.08);
  setPhase("opening");
  elements.video.play().catch(handleVideoError);
  window.requestAnimationFrame(trackInitialOpening);
}

function trackInitialOpening() {
  if (app.phase !== "opening" || app.initialDetectionTriggered) return;
  updateVideoProgress();
  if (app.phase === "opening") window.requestAnimationFrame(trackInitialOpening);
}

function retryExperience() {
  resetAttemptState();
  app.score = 200;
  elements.video.pause();
  elements.video.currentTime = 0;
  setPhase("armed");
}

function resetAttemptState() {
  clearStopCountdown();
  clearCeilingRadarTimeout();
  stopElapsedTimer();
  if (app.obstacleFlightFrame) window.cancelAnimationFrame(app.obstacleFlightFrame);
  app.obstacleFlightFrame = null;
  elements.obstacle.classList.remove("obstacle-flying");
  app.positionPreset = "start";
  app.position = obstaclePosition(app.positionPreset);
  app.obstacleInside = false;
  app.hasDragged = false;
  app.countdownRemaining = COUNTDOWN_SECONDS;
  app.countdownExpired = false;
  app.ceilingRadarExpired = false;
  app.stopDeadline = 0;
  app.initialDetectionTriggered = false;
  app.progress = 0;
  app.stopCount = 0;
  app.detectedOnce = false;
  app.elapsed = 0;
}

function returnHome() {
  elements.video.pause();
  elements.video.currentTime = 0;
  resetAttemptState();
  app.score = 0;
  setHidden(elements.confirm, true);
  setPhase(app.featureActivated ? "scenario" : "intro");
}

function startElapsedTimer() {
  stopElapsedTimer();
  app.elapsedTimer = window.setInterval(() => {
    if (!isActiveMovement()) return;
    app.elapsed = (performance.now() - app.startedAt) / 1000;
  }, 100);
}

function stopElapsedTimer() {
  if (app.elapsedTimer) window.clearInterval(app.elapsedTimer);
  app.elapsedTimer = null;
}

function updateVideoProgress() {
  if (!Number.isFinite(elements.video.duration) || elements.video.duration === 0) return;
  if (app.phase === "stopped") return;
  app.progress = (elements.video.currentTime / elements.video.duration) * 100;
  const detectionProgress = app.scenarioMode === "ceiling"
    ? CEILING_DETECTION_PROGRESS
    : REAR_DETECTION_PROGRESS;

  if (
    app.phase === "opening" &&
    !app.initialDetectionTriggered &&
    app.progress >= detectionProgress
  ) {
    app.initialDetectionTriggered = true;
    app.progress = detectionProgress;
    if (app.scenarioMode === "ceiling") stopForCeilingObstacle();
    else launchObstacle();
    return;
  }
}

function finishVideo() {
  app.progress = 100;
  app.elapsed = app.startedAt ? (performance.now() - app.startedAt) / 1000 : app.elapsed;
  stopElapsedTimer();

  if (app.detectedOnce) {
    app.score += Math.max(100, 250 - Math.floor(app.elapsed * 8));
    playTone(660, 0.12);
    window.setTimeout(() => playTone(880, 0.14), 120);
    window.setTimeout(() => playTone(1100, 0.2), 250);
    setPhase("success");
  } else {
    playTone(180, 0.25, "triangle");
    setPhase("missed");
  }
}

function handleVideoError(error) {
  console.warn("영상을 재생하지 못했습니다. 소스 파일 경로를 확인하세요.", error);
}

function playTone(frequency, duration = 0.1, type = "sine") {
  if (!app.soundOn) return;

  try {
    app.audioContext ||= new window.AudioContext();
    const oscillator = app.audioContext.createOscillator();
    const gain = app.audioContext.createGain();
    oscillator.type = type;
    oscillator.frequency.value = frequency;
    gain.gain.setValueAtTime(0.055, app.audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, app.audioContext.currentTime + duration);
    oscillator.connect(gain).connect(app.audioContext.destination);
    oscillator.start();
    oscillator.stop(app.audioContext.currentTime + duration);
  } catch (error) {
    console.debug("효과음을 재생할 수 없습니다.", error);
  }
}

function pointerPosition(event) {
  const bounds = elements.stage.getBoundingClientRect();
  return {
    x: ((event.clientX - bounds.left) / bounds.width) * 100,
    y: ((event.clientY - bounds.top) / bounds.height) * 100,
  };
}

elements.obstacle.addEventListener("pointerdown", (event) => {
  if (!["stopped", "reopening"].includes(app.phase)) return;
  if (elements.obstacle.classList.contains("obstacle-flying")) return;
  app.dragging = true;
  event.currentTarget.setPointerCapture(event.pointerId);
  moveObstacle(pointerPosition(event));
});

elements.obstacle.addEventListener("pointermove", (event) => {
  if (app.dragging) moveObstacle(pointerPosition(event));
});

function stopDragging(event) {
  app.dragging = false;
  if (event.currentTarget.hasPointerCapture(event.pointerId)) {
    event.currentTarget.releasePointerCapture(event.pointerId);
  }
}

elements.obstacle.addEventListener("pointerup", stopDragging);
elements.obstacle.addEventListener("pointercancel", stopDragging);

elements.obstacle.addEventListener("keydown", (event) => {
  if (!["stopped", "reopening"].includes(app.phase)) return;
  if (elements.obstacle.classList.contains("obstacle-flying")) return;

  const movements = {
    ArrowLeft: { x: -3, y: 0 },
    ArrowRight: { x: 3, y: 0 },
    ArrowUp: { x: 0, y: -3 },
    ArrowDown: { x: 0, y: 3 },
  };
  const movement = movements[event.key];
  if (!movement) return;

  event.preventDefault();
  moveObstacle({
    x: app.position.x + movement.x,
    y: app.position.y + movement.y,
  });
});

root.querySelector('[data-action="start"]').addEventListener("click", startExperience);
root.querySelectorAll("[data-scenario]").forEach((button) => {
  button.addEventListener("click", () => selectScenario(button.dataset.scenario));
});
root.querySelector('[data-action="close-settings"]').addEventListener("click", () => setPhase("intro"));
root.querySelector('[data-action="show-confirm"]').addEventListener("click", () => setHidden(elements.confirm, false));
root.querySelector('[data-action="hide-confirm"]').addEventListener("click", () => setHidden(elements.confirm, true));
root.querySelector('[data-action="activate"]').addEventListener("click", activateFeature);
elements.openButton.addEventListener("click", openTailgate);
elements.retryButton.addEventListener("click", retryExperience);
elements.replayButton.addEventListener("click", retryExperience);
root.querySelector('[data-action="home"]').addEventListener("click", returnHome);

elements.video.addEventListener("timeupdate", updateVideoProgress);
elements.video.addEventListener("ended", finishVideo);
elements.video.addEventListener("loadedmetadata", syncObstacleToVideo);

let obstacleResizeFrame = null;
function scheduleObstacleSync() {
  if (obstacleResizeFrame) window.cancelAnimationFrame(obstacleResizeFrame);
  obstacleResizeFrame = window.requestAnimationFrame(() => {
    obstacleResizeFrame = null;
    syncObstacleToVideo();
  });
}

window.addEventListener("resize", scheduleObstacleSync);
if ("ResizeObserver" in window) {
  new ResizeObserver(scheduleObstacleSync).observe(elements.stage);
}

updateInterface();
    </script>
  </body>
</html>
