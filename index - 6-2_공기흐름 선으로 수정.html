<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111d">
  <title>공기저항계수 인터랙티브 시뮬레이션</title>
  <style>
    :root{
      --bg:#04080e;
      --panel:rgba(8,18,31,.72);
      --panel-strong:rgba(7,15,27,.90);
      --line:rgba(146,194,255,.22);
      --text:#f7fbff;
      --muted:#93a7bc;
      --blue:#59b9ff;
      --blue2:#176cff;
      --cyan:#75f3ff;
      --good:#68ffd2;
      --shadow:0 24px 80px rgba(0,0,0,.42);
    }

    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:var(--bg);color:var(--text)}
    body{
      overflow:hidden;
      font-family:Inter, Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont,
                  "Segoe UI", sans-serif;
      -webkit-font-smoothing:antialiased;
      user-select:none;
    }

    button,input{font:inherit}
    button{color:inherit}

    .app{
      position:relative;
      width:100%;
      height:100%;
      min-height:520px;
      overflow:hidden;
      background:
        radial-gradient(circle at 72% 42%, rgba(31,104,188,.18), transparent 34%),
        radial-gradient(circle at 16% 15%, rgba(34,79,126,.16), transparent 30%),
        linear-gradient(180deg,#07101a 0%,#04080e 68%,#020509 100%);
    }

    .noise{
      position:absolute;inset:0;pointer-events:none;opacity:.16;mix-blend-mode:screen;
      background-image:
        radial-gradient(rgba(255,255,255,.34) .55px, transparent .55px),
        radial-gradient(rgba(91,179,255,.22) .45px, transparent .45px);
      background-size:22px 22px, 37px 37px;
      background-position:0 0, 9px 14px;
      mask-image:linear-gradient(to bottom,black,transparent 78%);
    }

    .android-performance .noise{display:none}
    .android-performance .vehicle-wrap{filter:none}
    .android-performance .metric-main,
    .android-performance .metric-mini,
    .android-performance .bottom-panel,
    .android-performance .live{backdrop-filter:none}

    .grid{
      position:absolute;inset:0;pointer-events:none;opacity:.20;
      background-image:
        linear-gradient(rgba(80,145,206,.14) 1px,transparent 1px),
        linear-gradient(90deg,rgba(80,145,206,.11) 1px,transparent 1px);
      background-size:64px 64px;
      transform:perspective(550px) rotateX(67deg) scale(1.55);
      transform-origin:center 68%;
      mask-image:linear-gradient(to bottom,transparent 38%,black 72%,transparent 100%);
    }

    .topbar{
      position:absolute;z-index:20;left:clamp(22px,4vw,68px);right:clamp(22px,4vw,68px);
      top:clamp(18px,3.5vh,44px);display:flex;justify-content:space-between;gap:24px;align-items:flex-start;
      pointer-events:none;
    }

    .heading{max-width:620px}
    .header-metric{width:clamp(222px,20.5vw,310px)}
    .eyebrow{
      display:flex;align-items:center;gap:9px;
      color:#8ed7ff;font-size:12px;letter-spacing:.18em;text-transform:uppercase;
      margin-bottom:10px;
    }
    .eyebrow::before{content:"";width:26px;height:1px;background:#65c8ff;box-shadow:0 0 12px #4bbaff}

    .live{
      display:flex;align-items:center;gap:9px;border:1px solid rgba(124,190,255,.24);
      background:rgba(5,13,23,.58);backdrop-filter:blur(14px);
      border-radius:999px;padding:10px 14px;color:#b9dbf7;font-size:12px;letter-spacing:.07em;
    }
    .live-dot{width:7px;height:7px;border-radius:50%;background:#67ffd0;box-shadow:0 0 12px #67ffd0}

    .stage{
      position:absolute;z-index:4;inset:0;
      touch-action:none;cursor:ew-resize;outline:none;
    }

    canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
    #backCanvas{z-index:1}
    #frontCanvas{z-index:5}

    .vehicle-wrap{
      position:absolute;z-index:3;
      left:50%;top:50%;
      width:min(73vw,1120px);
      transform:translate(-46%,-42%);
      filter:drop-shadow(0 28px 24px rgba(0,0,0,.58));
      pointer-events:none;
    }
    .vehicle{
      display:block;width:100%;height:auto;
      transform:translateZ(0);
    }

    .vehicle-glow{
      position:absolute;left:7%;right:4%;bottom:5%;height:7%;
      border-radius:50%;background:rgba(64,164,255,.30);
      filter:blur(18px);opacity:.8;transform:scaleX(1.03);
    }

    .speed-halo{
      position:absolute;z-index:2;left:13%;right:7%;top:61%;height:1px;
      background:linear-gradient(90deg,transparent,rgba(84,186,255,.78),transparent);
      filter:drop-shadow(0 0 10px #49b4ff);opacity:.55;
    }

    .metrics{
      position:absolute;z-index:20;left:clamp(18px,4vw,64px);top:clamp(174px,25vh,238px);
      width:clamp(222px,20.5vw,310px);display:grid;gap:10px;pointer-events:none;
    }

    .metric-main,.metric-mini{
      border:1px solid rgba(137,193,245,.20);
      background:linear-gradient(145deg,rgba(12,27,44,.88),rgba(4,12,22,.72));
      backdrop-filter:blur(18px);box-shadow:var(--shadow);
    }

    .metric-main{padding:20px 20px 18px;border-radius:21px}
    .metric-label{font-size:13px;color:#a9bdd0;display:flex;align-items:center;justify-content:space-between}
    .cd-row{display:flex;align-items:baseline;gap:7px;margin-top:9px}
    .cd-prefix{font-size:27px;font-weight:500;color:#d9ecff}
    .cd-value{font-size:clamp(52px,5vw,76px);line-height:1;font-weight:640;letter-spacing:-.055em}
    .metric-desc{margin-top:11px;padding-top:12px;border-top:1px solid rgba(137,193,245,.14);font-size:12px;color:#92a6b9;line-height:1.55}

    .mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .metric-mini{border-radius:16px;padding:13px 14px}
    .mini-label{font-size:11px;color:#8398ad}
    .mini-value{margin-top:5px;font-size:20px;font-weight:570;letter-spacing:-.025em}
    .mini-unit{font-size:11px;color:#8fa6ba;margin-left:3px}

    .drag-scale{
      margin-top:12px;height:4px;border-radius:999px;background:rgba(135,190,242,.13);overflow:hidden
    }
    .drag-fill{
      height:100%;width:16%;border-radius:inherit;
      background:linear-gradient(90deg,#2a7fff,#77efff);
      box-shadow:0 0 12px rgba(95,212,255,.9);
      transition:width .12s linear;
    }

    .bottom-panel{
      position:absolute;z-index:20;left:clamp(18px,4vw,64px);right:clamp(18px,4vw,64px);
      bottom:clamp(18px,3.5vh,40px);
      min-height:128px;border:1px solid rgba(140,198,249,.24);
      border-radius:24px;background:linear-gradient(135deg,rgba(10,24,40,.87),rgba(4,11,20,.80));
      backdrop-filter:blur(22px);box-shadow:var(--shadow);
      display:grid;grid-template-columns:minmax(160px,.62fr) minmax(320px,1.5fr) minmax(260px,1.2fr);
      align-items:center;gap:22px;padding:20px 24px;
    }

    .speed-block{display:flex;align-items:flex-end;gap:10px;min-width:0}
    .speed-copy{min-width:0}
    .speed-label{font-size:12px;color:#a0b4c8;margin-bottom:4px}
    .speed-number{
      font-size:clamp(48px,5vw,74px);font-weight:620;line-height:.88;letter-spacing:-.055em;
      font-variant-numeric:tabular-nums;
      text-shadow:0 0 22px rgba(87,184,255,.18);
    }
    .speed-unit{font-size:17px;color:#a8bfd4;margin-bottom:5px}
    .mode-pill{
      margin-left:auto;align-self:center;white-space:nowrap;
      border:1px solid rgba(101,207,255,.24);border-radius:999px;padding:8px 10px;
      color:#85dcff;background:rgba(48,128,195,.10);font-size:11px;letter-spacing:.04em;
    }

    .gesture{border-left:1px solid rgba(140,198,249,.13);padding-left:24px}
    .gesture-title{font-size:14px;font-weight:540}
    .gesture-copy{margin-top:7px;color:#91a8bb;font-size:12px;line-height:1.55}
    .controls{display:grid;grid-template-columns:1fr auto;gap:12px 14px;align-items:center}
    .range-wrap{grid-column:1/-1}
    .range-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .range-title{font-size:12px;color:#9fb4c7}
    .range-value{font-size:13px;color:#7fd5ff;font-variant-numeric:tabular-nums}
    input[type="range"]{
      width:100%;accent-color:#4db8ff;cursor:pointer;
    }
    .scale{display:flex;justify-content:space-between;color:#71869a;font-size:10px;margin-top:4px}

    .control-btn{
      min-height:38px;border-radius:12px;border:1px solid rgba(129,190,244,.20);
      background:rgba(10,23,38,.75);padding:8px 13px;cursor:pointer;
      transition:background .2s,border-color .2s,transform .15s;
    }
    .control-btn:hover{background:rgba(25,55,86,.78);border-color:rgba(129,205,255,.38)}
    .control-btn:active{transform:scale(.97)}
    .control-btn.primary{background:linear-gradient(135deg,rgba(25,112,229,.80),rgba(41,174,231,.70));border-color:rgba(111,210,255,.45)}
    .control-btn:focus-visible,input:focus-visible,.stage:focus-visible{outline:2px solid #84d8ff;outline-offset:3px}

    .footer-note{
      position:absolute;z-index:12;right:clamp(22px,4vw,68px);bottom:8px;
      font-size:9px;color:rgba(144,164,183,.55);pointer-events:none;
    }

    @media (max-width:900px){
      .app{min-height:600px}
      .topbar{top:20px}
      .live{display:none}
      .metrics{top:146px;width:220px}
      .metric-main{padding:15px}
      .header-metric{width:220px}
      .mini-grid{display:none}
      .vehicle-wrap{width:90vw;transform:translate(-47%,-37%)}
      .bottom-panel{
        grid-template-columns:.72fr 1.28fr;
        padding:16px 18px;gap:18px;min-height:142px
      }
      .controls{grid-column:1/-1;grid-template-columns:1fr auto auto}
      .range-wrap{grid-column:1/2}
      .gesture{padding-left:18px}
      .footer-note{display:none}
    }

    @media (max-width:620px){
      body{overflow:auto}
      .app{height:100svh;min-height:720px}
      .topbar{left:18px;right:18px}
      .metrics{left:18px;top:150px;width:185px}
      .metric-main{border-radius:17px}
      .header-metric{width:185px}
      .cd-value{font-size:48px}
      .cd-prefix{font-size:22px}
      .vehicle-wrap{width:100vw;top:48%;transform:translate(-50%,-36%)}
      .bottom-panel{
        left:12px;right:12px;bottom:12px;border-radius:20px;
        grid-template-columns:1fr;gap:11px;padding:14px 16px;min-height:218px
      }
      .speed-block{padding-bottom:8px;border-bottom:1px solid rgba(140,198,249,.13)}
      .speed-number{font-size:52px}
      .gesture{border-left:0;padding-left:0}
      .gesture-copy{display:none}
      .controls{grid-template-columns:1fr auto auto;gap:8px}
      .control-btn{padding:7px 10px;font-size:12px}
      .mode-pill{font-size:10px}
    }

  </style>
</head>
<body>
  <main class="app">
    <div class="noise"></div>
    <div class="grid"></div>

    <header class="topbar">
      <div class="heading">
        <div class="eyebrow">Interactive Aerodynamics</div>
        <div class="metric-main header-metric">
          <div class="metric-label">공기저항계수</div>
          <div class="cd-row"><span class="cd-prefix">Cd</span><span class="cd-value">0.29</span></div>
          <div class="metric-desc">낮은 공기저항계수는 고속 주행 시 공기 저항과 에너지 소모를 줄이는 데 유리합니다.</div>
          <div class="drag-scale"><div class="drag-fill" id="dragFill"></div></div>
        </div>
      </div>
      <div class="live"><span class="live-dot"></span>REAL-TIME SIMULATION</div>
    </header>

    <section class="metrics" aria-label="공기역학 지표">
      <div class="mini-grid">
        <div class="metric-mini">
          <div class="mini-label">추정 항력</div>
          <div class="mini-value"><span id="forceValue">247</span><span class="mini-unit">N</span></div>
        </div>
        <div class="metric-mini">
          <div class="mini-label">항력 소요 동력</div>
          <div class="mini-value"><span id="powerValue">5.5</span><span class="mini-unit">kW</span></div>
        </div>
      </div>
    </section>

    <div class="stage" id="stage" role="application" aria-label="공기 흐름 시뮬레이션. 좌우로 밀어 속도를 조절합니다." tabindex="0">
      <canvas id="backCanvas"></canvas>
      <div class="speed-halo"></div>
      <div class="vehicle-wrap">
        <div class="vehicle-glow"></div>
        <img class="vehicle" src="image.png" alt="측면에서 본 SUV 차량">
      </div>
      <canvas id="frontCanvas"></canvas>
    </div>

    <section class="bottom-panel" aria-label="속도 조작 패널">
      <div class="speed-block">
        <div class="speed-copy">
          <div class="speed-label">주행 속도</div>
          <div><span class="speed-number" id="speedNumber">80</span><span class="speed-unit"> km/h</span></div>
        </div>
        <div class="mode-pill">실시간 공력 시각화</div>
      </div>

      <div class="gesture">
        <div class="gesture-title">차량을 터치한 후 좌우로 움직이면 속도를 조절할 수 있습니다.</div>
        <div class="gesture-copy">왼쪽 → 오른쪽은 속도 증가 · 오른쪽 → 왼쪽은 속도 감소</div>
      </div>

      <div class="controls">
        <div class="range-wrap">
          <div class="range-head">
            <label class="range-title" for="speedRange">속도 직접 조절</label>
            <span class="range-value" id="rangeValue">80 km/h</span>
          </div>
          <input id="speedRange" type="range" min="0" max="200" step="1" value="80" aria-label="주행 속도">
          <div class="scale"><span>0</span><span>50</span><span>100</span><span>150</span><span>200</span></div>
        </div>
        <button class="control-btn" type="button" id="pauseBtn">일시정지</button>
        <button class="control-btn primary" type="button" id="resetBtn">80으로 초기화</button>
      </div>
    </section>

    <div class="footer-note">※ Cd 0.29, 전면면적 2.8㎡를 가정한 시각화 예시입니다.</div>
  </main>

  <script>
    (() => {
      const stage = document.getElementById('stage');
      const backCanvas = document.getElementById('backCanvas');
      const frontCanvas = document.getElementById('frontCanvas');
      const vehicleImage = document.querySelector('.vehicle');
      const bctx = backCanvas.getContext('2d');
      const fctx = frontCanvas.getContext('2d');

      const speedNumber = document.getElementById('speedNumber');
      const speedRange = document.getElementById('speedRange');
      const rangeValue = document.getElementById('rangeValue');
      const forceValue = document.getElementById('forceValue');
      const powerValue = document.getElementById('powerValue');
      const dragFill = document.getElementById('dragFill');
      const pauseBtn = document.getElementById('pauseBtn');
      const resetBtn = document.getElementById('resetBtn');

      const state = {
        speed: 80,
        targetSpeed: 80,
        paused: false,
        dragging: false,
        lastX: 0,
        pointerId: null,
        time: 0,
        lastFrameTime: 0,
        lastRenderTime: 0
      };

      let W = 0, H = 0, DPR = 1, cachedVehicleBox = null;
      const particles = [];
      const streaks = [];
      const maxFlowTravel = 2160;
      const isLowPowerAndroid = /Android/i.test(navigator.userAgent);
      if(isLowPowerAndroid) document.documentElement.classList.add('android-performance');
      const renderSettings = isLowPowerAndroid ? {
        maxDpr:1,
        particleDivisor:40,
        minParticles:18,
        maxParticles:30,
        streakDivisor:80,
        minStreaks:6,
        maxStreaks:14,
        backgroundLines:3,
        frontLanes:[0,2,4],
        lineSteps:64,
        frameInterval:1000/30,
        shadowBlur:0
      } : {
        maxDpr:2,
        particleDivisor:9,
        minParticles:70,
        maxParticles:155,
        streakDivisor:28,
        minStreaks:24,
        maxStreaks:60,
        backgroundLines:8,
        frontLanes:[0,2,4,7],
        lineSteps:130,
        frameInterval:0,
        shadowBlur:null
      };
      const vehicleAlphaBounds = {left:83/940, top:94/515, right:853/940, bottom:398/515};
      const upperFlowProfile = [
        [-.26,.44],[.10,.40],[.62,-.18],[.82,-.18],[.98,-.10],[1.16,.30],[1.34,.34]
      ];
      const sideFlowProfile = [
        [-.26,.56],[.14,.55],[.74,.56],[.98,.47],[1.34,.47]
      ];

      function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }
      function lerp(a,b,t){ return a + (b-a)*t; }

      function resize(){
        const r = stage.getBoundingClientRect();
        W = Math.max(1, r.width);
        H = Math.max(1, r.height);
        DPR = Math.min(window.devicePixelRatio || 1, renderSettings.maxDpr);
        [backCanvas, frontCanvas].forEach(c => {
          c.width = Math.round(W * DPR);
          c.height = Math.round(H * DPR);
          c.style.width = W + 'px';
          c.style.height = H + 'px';
        });
        bctx.setTransform(DPR,0,0,DPR,0,0);
        fctx.setTransform(DPR,0,0,DPR,0,0);
        cachedVehicleBox = null;
        makeParticles();
      }

      function rand(min,max){ return min + Math.random()*(max-min); }

      function makeParticles(){
        particles.length = 0;
        streaks.length = 0;

        const flowCount = Math.round(clamp(
          W/renderSettings.particleDivisor,
          renderSettings.minParticles,
          renderSettings.maxParticles
        ));
        for(let i=0;i<flowCount;i++){
          particles.push({
            x: rand(-W*.1,W*1.1),
            lane: Math.floor(rand(0,8)),
            size: rand(.55,1.55),
            alpha: rand(.16,.65),
            drift: rand(.82,1.18)
          });
        }

        const streakCount = Math.round(clamp(
          W/renderSettings.streakDivisor,
          renderSettings.minStreaks,
          renderSettings.maxStreaks
        ));
        for(let i=0;i<streakCount;i++){
          streaks.push({
            x:rand(-W,W), y:rand(H*.2,H*.78), len:rand(18,90),
            alpha:rand(.03,.13), drift:rand(.5,1.6)
          });
        }
      }

      function vehicleBox(){
        if(cachedVehicleBox) return cachedVehicleBox;

        const stageRect = stage.getBoundingClientRect();
        const imageRect = vehicleImage.getBoundingClientRect();
        if(imageRect.width > 0 && imageRect.height > 0){
          cachedVehicleBox = {
            x:imageRect.left-stageRect.left+imageRect.width*vehicleAlphaBounds.left,
            y:imageRect.top-stageRect.top+imageRect.height*vehicleAlphaBounds.top,
            w:imageRect.width*(vehicleAlphaBounds.right-vehicleAlphaBounds.left),
            h:imageRect.height*(vehicleAlphaBounds.bottom-vehicleAlphaBounds.top)
          };
          return cachedVehicleBox;
        }
        if(W < 620){
          cachedVehicleBox = {x:0,y:H*.27,w:W,h:H*.38};
        }else if(W < 900){
          cachedVehicleBox = {x:W*.08,y:H*.28,w:W*.90,h:H*.39};
        }else{
          cachedVehicleBox = {x:W*.26,y:H*.27,w:W*.70,h:H*.45};
        }
        return cachedVehicleBox;
      }

      function sampleFlowProfile(profile, nx){
        if(nx <= profile[0][0]) return profile[0][1];
        for(let i=1;i<profile.length;i++){
          const previous = profile[i-1];
          const current = profile[i];
          if(nx <= current[0]){
            const progress = clamp((nx-previous[0])/(current[0]-previous[0]),0,1);
            const smoothProgress = progress*progress*(3-2*progress);
            return lerp(previous[1],current[1],smoothProgress);
          }
        }
        return profile[profile.length-1][1];
      }

      function flowY(x,lane,n){
        const box = vehicleBox();
        const nx = (x-box.x)/box.w;
        let entryHeight;
        let bodyHeight;

        if(lane <= 2){
          const offset = (lane-1)*.055;
          entryHeight = .44 + offset;
          bodyHeight = sampleFlowProfile(upperFlowProfile,nx) + offset;
        }else if(lane <= 5){
          const offset = (lane-4)*.05;
          entryHeight = .56 + offset;
          bodyHeight = sampleFlowProfile(sideFlowProfile,nx) + offset;
        }else{
          const offset = (lane-6.5)*.085;
          entryHeight = .84 + offset;
          bodyHeight = entryHeight;
        }

        const y = box.y + box.h*lerp(entryHeight,bodyHeight,n);
        return y;
      }

      function drawBackdrop(ctx, t, n, deltaSeconds){
        ctx.clearRect(0,0,W,H);

        const floorY = H*.69;
        const floor = ctx.createLinearGradient(0,floorY-80,0,H);
        floor.addColorStop(0,'rgba(29,76,116,0)');
        floor.addColorStop(.38,'rgba(17,47,73,.10)');
        floor.addColorStop(1,'rgba(2,7,12,.60)');
        ctx.fillStyle = floor;
        ctx.fillRect(0,floorY-80,W,H-floorY+80);

        const frontX = vehicleBox().x + vehicleBox().w*.045;
        const frontY = vehicleBox().y + vehicleBox().h*.51;
        const rg = ctx.createRadialGradient(frontX,frontY,2,frontX,frontY,Math.max(65,W*.08));
        rg.addColorStop(0,`rgba(88,200,255,${.20+.28*n})`);
        rg.addColorStop(.4,`rgba(36,125,223,${.10+.16*n})`);
        rg.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=rg;
        ctx.fillRect(frontX-W*.12,frontY-H*.18,W*.25,H*.36);

        const motion = maxFlowTravel * n * deltaSeconds;
        for(const s of streaks){
          s.x += motion*s.drift;
          if(s.x>W+120) s.x=-s.len-30;
          ctx.beginPath();
          ctx.moveTo(s.x,s.y);
          ctx.lineTo(s.x+s.len*(.35+n),s.y);
          ctx.strokeStyle=`rgba(108,190,255,${s.alpha*(.25+n)})`;
          ctx.lineWidth=.7;
          ctx.stroke();
        }
      }

      function drawStreamlines(ctx,t,n,front){
        ctx.save();
        ctx.lineCap='round';

        const lineCount = front ? renderSettings.frontLanes.length : renderSettings.backgroundLines;
        for(let lane=0;lane<lineCount;lane++){
          const mappedLane = front ? renderSettings.frontLanes[lane] : lane;
          const alphaBase = front ? .20 : .12;
          const path = new Path2D();
          const steps = renderSettings.lineSteps;
          for(let i=0;i<=steps;i++){
            const x = -W*.05 + (W*1.12)*(i/steps);
            const y = flowY(x,mappedLane,n);
            if(i===0) path.moveTo(x,y); else path.lineTo(x,y);
          }

          ctx.setLineDash([]);
          ctx.strokeStyle=`rgba(59,135,229,${alphaBase + n*.12})`;
          ctx.lineWidth=front ? 1.25 : .8;
          ctx.stroke(path);

          const dashPattern = isLowPowerAndroid
            ? [Math.max(W*.72,260),4]
            : [22 + n*22, 84 - n*24];
          ctx.setLineDash(dashPattern);
          ctx.lineDashOffset=-(t*.54 + mappedLane*17);
          const glow = ctx.createLinearGradient(0,0,W,0);
          glow.addColorStop(0,'rgba(74,153,248,0)');
          glow.addColorStop(.24,`rgba(94,192,255,${.18+n*.38})`);
          glow.addColorStop(.72,`rgba(117,236,255,${.20+n*.52})`);
          glow.addColorStop(1,'rgba(65,139,255,0)');
          ctx.strokeStyle=glow;
          ctx.lineWidth=front ? 2.1 : 1.45;
          ctx.shadowColor='rgba(73,177,255,.72)';
          ctx.shadowBlur=renderSettings.shadowBlur === null ? (front ? 9 : 5) : renderSettings.shadowBlur;
          ctx.stroke(path);
          ctx.shadowBlur=0;
        }
        ctx.restore();
      }

      function drawFlowParticles(ctx,n,deltaSeconds){
        const travel = maxFlowTravel * n * deltaSeconds;
        for(const p of particles){
          p.x += travel*p.drift;
          if(p.x>W+14) p.x=-rand(10,W*.16);

          const y = flowY(p.x,p.lane,n);
          const a = p.alpha*(.2+n*.85);
          ctx.beginPath();
          ctx.arc(p.x,y,p.size*(.7+n*.7),0,Math.PI*2);
          ctx.fillStyle=`rgba(119,224,255,${a})`;
          ctx.fill();
        }
      }

      function drawGround(ctx,t,n){
        const box=vehicleBox();
        const y=box.y+box.h*.83;
        const grad=ctx.createLinearGradient(box.x,0,box.x+box.w,0);
        grad.addColorStop(0,'rgba(63,158,255,0)');
        grad.addColorStop(.18,`rgba(68,182,255,${.12+n*.36})`);
        grad.addColorStop(.75,`rgba(89,230,255,${.16+n*.48})`);
        grad.addColorStop(1,'rgba(44,128,255,0)');
        ctx.beginPath();
        ctx.moveTo(box.x-W*.08,y);
        ctx.bezierCurveTo(box.x+box.w*.15,y+9,box.x+box.w*.62,y+2,box.x+box.w*1.15,y+4);
        ctx.strokeStyle=grad;
        ctx.lineWidth=2.2;
        ctx.shadowColor='rgba(68,190,255,.85)';
        ctx.shadowBlur=renderSettings.shadowBlur === null ? 10 : renderSettings.shadowBlur;
        ctx.stroke();
        ctx.shadowBlur=0;

        const dashSpeed=t*.90;
        ctx.setLineDash(isLowPowerAndroid ? [Math.max(W*.82,300),4] : [50,95]);
        ctx.lineDashOffset=-dashSpeed;
        ctx.strokeStyle=`rgba(111,232,255,${.14+n*.42})`;
        ctx.lineWidth=1.2;
        ctx.stroke();
        ctx.setLineDash([]);
      }

      function setSpeed(value){
        state.targetSpeed=clamp(value,0,200);
        speedRange.value=Math.round(state.targetSpeed);
      }

      function updateUI(){
        const s=Math.round(state.speed);
        const v=state.speed/3.6;
        const force=.5*1.225*.29*2.8*v*v;
        const power=force*v/1000;

        speedNumber.textContent=s;
        rangeValue.textContent=s+' km/h';
        forceValue.textContent=Math.round(force).toLocaleString('ko-KR');
        powerValue.textContent=power.toFixed(1);
        dragFill.style.width=clamp((state.speed/200)*100,2,100)+'%';
        if(!state.dragging) speedRange.value=s;
      }

      function animate(now){
        if(renderSettings.frameInterval && state.lastRenderTime && now-state.lastRenderTime < renderSettings.frameInterval){
          requestAnimationFrame(animate);
          return;
        }
        state.lastRenderTime=now;
        const previousFrameTime=state.lastFrameTime || now;
        const deltaSeconds=clamp((now-previousFrameTime)/1000,0,.05);
        state.lastFrameTime=now;

        if(!state.paused){
          const smoothing=1-Math.pow(.001,deltaSeconds);
          state.speed=lerp(state.speed,state.targetSpeed,smoothing);
          state.time+=deltaSeconds*1000*(state.speed/200);
        }
        const n=state.speed/200;
        cachedVehicleBox = null;
        const flowDeltaSeconds=state.paused ? 0 : deltaSeconds;

        drawBackdrop(bctx,state.time,n,flowDeltaSeconds);
        drawStreamlines(bctx,state.time,n,false);
        drawGround(bctx,state.time,n);

        fctx.clearRect(0,0,W,H);
        drawStreamlines(fctx,state.time,n,true);
        drawFlowParticles(fctx,n,flowDeltaSeconds);

        updateUI();
        requestAnimationFrame(animate);
      }

      stage.addEventListener('pointerdown',e=>{
        state.dragging=true;
        state.pointerId=e.pointerId;
        state.lastX=e.clientX;
        stage.setPointerCapture(e.pointerId);
      });

      stage.addEventListener('pointermove',e=>{
        if(!state.dragging || e.pointerId!==state.pointerId)return;
        const dx=e.clientX-state.lastX;
        state.lastX=e.clientX;
        if(Math.abs(dx)>.05) setSpeed(state.targetSpeed+dx*.42);
      });

      function endPointer(e){
        if(e.pointerId!==state.pointerId)return;
        state.dragging=false;
        state.pointerId=null;
      }
      stage.addEventListener('pointerup',endPointer);
      stage.addEventListener('pointercancel',endPointer);

      stage.addEventListener('wheel',e=>{
        e.preventDefault();
        setSpeed(state.targetSpeed + (e.deltaY<0?6:-6));
      },{passive:false});

      stage.addEventListener('keydown',e=>{
        if(e.key==='ArrowRight'){e.preventDefault();setSpeed(state.targetSpeed+5)}
        if(e.key==='ArrowLeft'){e.preventDefault();setSpeed(state.targetSpeed-5)}
        if(e.key===' '){e.preventDefault();togglePause()}
      });

      speedRange.addEventListener('input',e=>setSpeed(Number(e.target.value)));

      function togglePause(){
        state.paused=!state.paused;
        pauseBtn.textContent=state.paused?'재생':'일시정지';
        pauseBtn.classList.toggle('primary',state.paused);
      }

      pauseBtn.addEventListener('click',togglePause);
      resetBtn.addEventListener('click',()=>{
        state.paused=false;
        pauseBtn.textContent='일시정지';
        pauseBtn.classList.remove('primary');
        setSpeed(80);
      });

      window.addEventListener('resize',resize,{passive:true});
      resize();
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
