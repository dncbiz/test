:root {
  --navy:#002c5f;
  --blue:#00aad2;
  --cyan:#61e7ff;
  --danger:#ff4a45;
  --amber:#ffba45;
  --safe:#20d495;
  --ink:#07131f;
  --panel:#04111edb
}

* {
  box-sizing:border-box
}

html,body {
  background:#06111b;
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden
}

body {
  color:#fff;
  font-family:Arial,Noto Sans KR,sans-serif
}

button,a {
  font:inherit
}

button {
  cursor:pointer
}

.game-shell {
  color:#fff;
  background:#07131f;
  grid-template-rows:68px minmax(0,1fr);
  width:100vw;
  height:100dvh;
  min-height:620px;
  display:grid;
  position:relative;
  overflow:hidden
}

.game-topbar {
  z-index:40;
  background:#020e1bf7;
  border-bottom:1px solid #8ecbe738;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  padding:0 26px;
  display:grid;
  position:relative;
  box-shadow:0 8px 30px #0000002e
}

.experience-title {
  grid-column:2;
  justify-self:center;
  margin:0;
  color:#fff;
  letter-spacing:-.035em;
  font-size:20px;
  font-weight:700;
  white-space:nowrap
}

.header-reset {
  grid-column:3;
  justify-self:end;
  color:#b9cad4;
  border:1px solid #8ecbe738;
  border-radius:50%;
  background:#061522c7;
  place-items:center;
  width:40px;
  height:40px;
  font-size:20px;
  line-height:1;
  transition:color .2s,border-color .2s,background .2s;
  display:grid
}

.header-reset:hover {
  color:#fff;
  border-color:var(--cyan);
  background:#07304a
}

.game-stage {
  isolation:isolate;
  background:#9ea3a4;
  min-height:0;
  position:relative;
  overflow:hidden
}

.game-video {
  object-fit:cover;
  object-position:center 48%;
  filter:saturate(.86)contrast(1.05)brightness(.84);
  -webkit-user-select:none;
  user-select:none;
  width:100%;
  height:100%;
  position:absolute;
  top:0;
  bottom:0;
  left:0;
  right:0
}

/* PC 가로 화면: 테일게이트 상단은 남기고 차량을 위로 올려 하단 노출을 확보합니다. */
@media (min-width:1021px) and (orientation:landscape) {
  .game-video {
    object-position:center 54.5%
  }
}

.stage-grade {
  pointer-events:none;
  background:linear-gradient(90deg,#001222b3,#0000 25% 66%,#00101e85),linear-gradient(#02111e4d,#0000 28% 70%,#000c1894);
  position:absolute;
  top:0;
  bottom:0;
  left:0;
  right:0
}

.stage-grid {
  opacity:.14;
  pointer-events:none;
  background-image:linear-gradient(#85e4ff52 1px,#0000 1px),linear-gradient(90deg,#85e4ff52 1px,#0000 1px);
  background-size:8vw 8vw;
  position:absolute;
  top:0;
  bottom:0;
  left:0;
  right:0;
  -webkit-mask-image:linear-gradient(90deg,#000,#0000 34% 72%,#000);
  mask-image:linear-gradient(90deg,#000,#0000 34% 72%,#000)
}

.scan-line {
  opacity:0;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);
  height:2px;
  box-shadow:0 0 16px var(--cyan);
  pointer-events:none;
  position:absolute;
  top:-2px;
  left:0;
  right:0
}

.phase-opening .scan-line,.phase-reopening .scan-line {
  opacity:.65;
  animation:2.2s linear infinite scanDown
}

@keyframes scanDown {
  to {
    transform:translateY(calc(100dvh - 140px))
  }

}

.radar-zone {
  opacity:0;
  pointer-events:none;
  background:radial-gradient(at 60% 70%,#24cdff2e,#0000 66%);
  border:1px dashed #61e7ffb3;
  border-radius:48% 52% 43% 57%;
  width:28%;
  height:68%;
  transition:all .25s;
  position:absolute;
  top:13%;
  left:20%
}

.radar-zone.visible {
  opacity:1
}

.radar-zone:before,.radar-zone:after {
  content:"";
  border-radius:inherit;
  border:1px solid #61e7ff70;
  animation:1.8s infinite zonePulse;
  position:absolute;
  top:13%;
  bottom:13%;
  left:13%;
  right:13%
}

.radar-zone:after {
  animation-delay:.3s;
  top:28%;
  bottom:28%;
  left:28%;
  right:28%
}

.radar-zone>i {
  border:2px solid #0000;
  border-top-color:var(--cyan);
  filter:drop-shadow(0 0 5px var(--cyan));
  border-radius:50%;
  animation:1.5s infinite radarArc;
  position:absolute;
  bottom:14%;
  left:52%;
  transform:translate(-50%)
}

.radar-zone>i:first-child {
  width:34%;
  height:20%
}

.radar-zone>i:nth-child(2) {
  width:60%;
  height:34%;
  animation-delay:.16s
}

.radar-zone>i:nth-child(3) {
  width:86%;
  height:50%;
  animation-delay:.32s
}

.radar-zone>span {
  color:#bdf7ff;
  letter-spacing:.16em;
  background:#002037ad;
  padding:6px 8px;
  font-size:8px;
  position:absolute;
  top:17px;
  left:17px
}

@keyframes zonePulse {
  50% {
    opacity:.15;
    transform:scale(1.035)
  }

}

@keyframes radarArc {
  50% {
    opacity:.2
  }

}

.obstacle-inside .radar-zone {
  border-color:var(--danger);
  background:radial-gradient(at 60% 70%,#ff4a4542,#0000 67%);
  animation:.52s infinite alternate dangerFlash
}

.obstacle-inside .radar-zone:before,.obstacle-inside .radar-zone:after,.obstacle-inside .radar-zone>i {
  border-top-color:var(--danger);
  border-color:#ff4a4585
}

.obstacle-inside .radar-zone>span {
  background:var(--danger);
  color:#fff
}

@keyframes dangerFlash {
  to {
    box-shadow:inset 0 0 60px #ff25212e,0 0 35px #ff2d2633
  }

}

.experience-hud {
  z-index:30;
  pointer-events:none;
  flex-direction:column;
  gap:8px;
  width:min(520px,calc(100% - 32px));
  display:flex;
  position:absolute;
  bottom:18px;
  left:50%;
  transform:translate(-50%)
}

.mission-banner {
  -webkit-backdrop-filter:blur(14px);
  backdrop-filter:blur(14px);
  text-align:left;
  background:#071a2bde;
  border:1px solid #8cafd633;
  border-radius:14px;
  width:100%;
  padding:11px 15px;
  animation:.32s both bannerIn;
  box-shadow:0 12px 32px #00000038
}

.mission-banner small,.mission-banner strong {
  display:block
}

.mission-banner small {
  color:var(--cyan);
  letter-spacing:.16em;
  margin-bottom:5px;
  font-size:7px
}

.mission-banner strong {
  font-size:12px;
  line-height:1.45
}

.mission-banner.stopped {
  border-color:#ffa44963
}

.mission-banner.stopped small {
  color:#ffc06f
}

.mission-banner.reopening,.mission-banner.success {
  border-color:#20d49570
}

.mission-banner.reopening small,.mission-banner.success small {
  color:#6ff0c2
}

@keyframes bannerIn {
  0% {
    opacity:0;
    transform:translateY(8px)
  }
}

.status-toast {
  -webkit-backdrop-filter:blur(16px);
  backdrop-filter:blur(16px);
  background:#07121ed9;
  border:1px solid #8cafd633;
  border-radius:17px;
  align-items:center;
  gap:13px;
  width:100%;
  min-width:0;
  padding:14px 15px;
  animation:.35s both toastIn;
  display:flex;
  box-shadow:0 15px 40px #0000004a,inset 0 1px #ffffff0a
}

@keyframes toastIn {
  0% {
    opacity:0;
    transform:translateY(8px)
  }
}

.status-glyph {
  width:40px;
  height:40px;
  color:var(--cyan);
  border:1px solid;
  border-radius:50%;
  flex:none;
  place-items:center;
  font-size:16px;
  font-weight:900;
  display:grid
}

.status-copy {
  flex:1;
  min-width:0
}

.status-copy small,.status-copy strong,.status-copy p {
  display:block
}

.status-copy small {
  color:#6ee7ff;
  letter-spacing:.16em;
  margin-bottom:4px;
  font-size:7px
}

.status-copy strong {
  font-size:13px
}

.status-copy p {
  color:#9db3c1;
  margin:4px 0 0;
  font-size:9px;
  line-height:1.45
}

.status-metric {
  border-left:1px solid #8cafd62e;
  flex:none;
  min-width:112px;
  padding-left:15px;
  text-align:right
}

.status-metric small,.status-metric strong {
  display:block
}

.status-metric small {
  color:#829bad;
  letter-spacing:.08em;
  font-size:7px
}

.status-metric strong {
  margin-top:4px;
  font-size:14px
}

.status-progress {
  background:#ffffff24;
  width:100%;
  height:3px;
  margin-top:8px;
  display:block;
  overflow:hidden
}

.status-progress b {
  background:var(--cyan);
  width:0;
  height:100%;
  transition:width .12s linear;
  display:block;
  box-shadow:0 0 8px var(--cyan)
}

.status-toast.danger {
  border-color:#ffa44970;
  background:#1d150cdf
}

.status-toast.danger .status-glyph,.status-toast.danger .status-copy small {
  color:#ffc06f
}

.status-toast.safe,.status-toast.success {
  border-color:#20d49570;
  background:#06251fdf
}

.status-toast.safe .status-glyph,.status-toast.safe .status-copy small,.status-toast.success .status-glyph,.status-toast.success .status-copy small {
  color:#6ff0c2
}

.status-toast.missed {
  background:#202832df;
  border-color:#9298a061
}

.status-toast.missed .status-glyph,.status-toast.missed .status-copy small {
  color:#c4c8ce
}

.clearance-countdown {
  color:#fff;
  text-align:center;
  pointer-events:none;
  background:#09243a;
  border:1px solid #61e7ff52;
  border-radius:12px;
  flex:none;
  width:74px;
  padding:8px 10px 10px;
  box-shadow:0 0 24px #00aad220
}

.clearance-countdown>strong {
  margin:0;
  display:block
}

.clearance-countdown>strong span {
  color:#fff;
  font-variant-numeric:tabular-nums;
  font-family:monospace;
  font-size:44px;
  line-height:1;
  text-shadow:0 0 16px #61e7ff70
}

.phase-stopped .status-metric {
  display:none
}

.clearance-countdown.expired {
  background:#142433;
  border-color:#7893a352;
  box-shadow:none
}

.clearance-countdown.expired>strong span {
  color:#b5c4cd;
  text-shadow:none
}

.drag-obstacle {
  z-index:18;
  color:#fff;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
  cursor:grab;
  filter:drop-shadow(0 14px 14px #0000004d);
  background:0 0;
  border:0;
  place-items:center;
  width:112px;
  height:112px;
  padding:0;
  transition:filter .18s;
  display:grid;
  position:absolute;
  transform:translate(-50%,-50%)
}

.drag-obstacle.luggage {
  width:128px;
  height:128px
}

.drag-obstacle .luggage-graphic {
  transform:scale(1.12)
}

.drag-obstacle.locked {
  cursor:default
}

.drag-obstacle.locked:hover {
  filter:drop-shadow(0 14px 14px #0000004d)
}

.drag-obstacle.carrier-flying {
  transition:left var(--carrier-flight-duration,800ms) cubic-bezier(.4,0,.2,1),top var(--carrier-flight-duration,800ms) cubic-bezier(.4,0,.2,1),filter .18s;
  filter:drop-shadow(-18px 10px 15px #0000004a)drop-shadow(0 0 13px #61e7ff66)
}

.drag-obstacle.carrier-flying:before {
  animation-duration:.7s
}

.drag-obstacle:active {
  cursor:grabbing
}

.drag-obstacle:focus-visible {
  outline:2px solid var(--cyan);
  outline-offset:5px
}

.drag-obstacle:before {
  content:"";
  opacity:.62;
  border:1px dashed #ffffff75;
  border-radius:50%;
  animation:8s linear infinite objectOrbit;
  position:absolute;
  top:4px;
  bottom:4px;
  left:4px;
  right:4px
}

.drag-obstacle:after {
  content:"";
  z-index:-1;
  background:#0020361f;
  border-radius:50%;
  position:absolute;
  top:14px;
  bottom:14px;
  left:14px;
  right:14px;
  box-shadow:0 0 26px #61e7ff26
}

.drag-obstacle:hover {
  filter:drop-shadow(0 18px 18px #0000006b)drop-shadow(0 0 10px #61e7ff7a)
}

.obstacle-inside .drag-obstacle {
  filter:drop-shadow(0 0 15px var(--danger)) drop-shadow(0 14px 14px #00000073)
}

.obstacle-inside .drag-obstacle:before {
  border-color:var(--danger);
  animation-duration:1.3s
}

@keyframes objectOrbit {
  to {
    transform:rotate(360deg)
  }

}

.drag-label {
  white-space:nowrap;
  letter-spacing:.13em;
  background:#001e32d1;
  border:1px solid #ffffff3d;
  padding:4px 7px;
  font-size:7px;
  position:absolute;
  bottom:-2px;
  left:50%;
  transform:translate(-50%)
}

.obstacle-inside .drag-label {
  background:var(--danger)
}

.drag-pulse {
  border:2px solid var(--cyan);
  pointer-events:none;
  border-radius:50%;
  animation:1.25s infinite dragPulse;
  position:absolute;
  top:-6px;
  bottom:-6px;
  left:-6px;
  right:-6px
}

@keyframes dragPulse {
  to {
    opacity:0;
    transform:scale(1.35)
  }

}

.box-graphic {
  background:linear-gradient(135deg,#c99455,#8f572c);
  border:2px solid #e6bb7a;
  width:61px;
  height:52px;
  position:relative;
  box-shadow:inset -8px -8px #4a250d26
}

.box-graphic i {
  background:#efc67db8;
  border-left:1px solid #5b31142e;
  border-right:1px solid #5b31142e;
  width:10px;
  position:absolute;
  top:0;
  bottom:0;
  left:43%
}

.box-graphic span {
  color:#3f1f0a9e;
  font-size:9px;
  font-weight:900;
  position:absolute;
  bottom:5px;
  right:7px
}

.cart-graphic {
  width:70px;
  height:54px;
  position:relative
}

.cart-graphic i {
  background:repeating-linear-gradient(90deg,#0000 0 8px,#dde9ee80 9px 11px);
  border:4px solid #aeb9c0;
  border-top:0;
  width:50px;
  height:31px;
  position:absolute;
  top:7px;
  left:8px;
  transform:skew(-10deg)
}

.cart-graphic span {
  transform-origin:100%;
  background:#d4dce0;
  width:17px;
  height:4px;
  position:absolute;
  top:0;
  left:0;
  transform:rotate(22deg)
}

.cart-graphic b {
  background:#14212a;
  border:3px solid #98a8b2;
  border-radius:50%;
  width:12px;
  height:12px;
  position:absolute;
  bottom:4px
}

.cart-graphic b:first-of-type {
  left:13px
}

.cart-graphic b:nth-of-type(2) {
  right:8px
}

.luggage-graphic {
  background:linear-gradient(135deg,#d8dde0,#738691);
  border:2px solid #ecf1f3;
  border-radius:7px;
  width:53px;
  height:64px;
  position:relative;
  box-shadow:inset -8px 0 #19293229
}

.luggage-graphic i {
  border:3px solid #87969f;
  border-bottom:0;
  border-radius:6px 6px 0 0;
  width:23px;
  height:13px;
  position:absolute;
  top:-14px;
  left:13px
}

.luggage-graphic span {
  background:#1f323d40;
  width:3px;
  position:absolute;
  top:15px;
  bottom:14px;
  left:8px
}

.luggage-graphic b {
  background:#17242c;
  border-radius:50%;
  width:9px;
  height:9px;
  position:absolute;
  bottom:-7px
}

.luggage-graphic b:first-of-type {
  left:7px
}

.luggage-graphic b:nth-of-type(2) {
  right:7px
}

.stage-actions {
  pointer-events:auto;
  width:100%
}

.open-button {
  color:#fff;
  text-align:left;
  background:linear-gradient(105deg,#276dff,#1e91e9 58%,#35b9df);
  border:1px solid #79ddff99;
  border-radius:16px;
  grid-template-rows:1fr 1fr;
  grid-template-columns:1fr auto;
  align-items:end;
  width:100%;
  height:60px;
  padding:0 11px 0 18px;
  transition:all .2s;
  display:grid;
  box-shadow:0 15px 34px #00122366,inset 0 1px #ffffff38
}

.open-button:hover {
  transform:translateY(-2px);
  box-shadow:0 19px 39px #0012236b,0 0 20px #30cdff2e
}

.open-button span {
  letter-spacing:.16em;
  color:#74dff5;
  align-self:end;
  font-size:7px
}

.open-button strong {
  align-self:start;
  margin-top:4px;
  font-size:13px
}

.open-button i {
  background:#ffffff1c;
  grid-area:1/2/3;
  align-self:center;
  place-items:center;
  width:39px;
  height:39px;
  font-style:normal;
  display:grid
}

.open-button.retry {
  background:linear-gradient(100deg,#2c3037f5,#4f575ff0);
  border-color:#ffffff5c
}

.open-button.success-button {
  background:linear-gradient(100deg,#004539f5,#008b67f0);
  border-color:#4defb58c
}

.open-button.success-button span {
  color:#8ff2cc
}

.timeline {
  z-index:21;
  background:#fff3;
  height:3px;
  position:absolute;
  bottom:0;
  left:0;
  right:0
}

.timeline i {
  background:var(--cyan);
  height:100%;
  box-shadow:0 0 10px var(--cyan);
  transition:width .12s linear;
  display:block
}

.timeline span {
  width:7px;
  height:7px;
  box-shadow:0 0 9px var(--cyan);
  background:#fff;
  border-radius:50%;
  position:absolute;
  top:50%;
  transform:translate(-50%,-50%)
}

.overlay-screen {
  z-index:60;
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
  background:#001222b0;
  place-items:center;
  padding:22px;
  animation:.3s both overlayIn;
  display:grid;
  position:fixed;
  top:68px;
  bottom:0;
  left:0;
  right:0
}

@keyframes overlayIn {
  0% {
    opacity:0
  }

}

.intro-overlay {
  -webkit-backdrop-filter:none;
  backdrop-filter:none;
  background:linear-gradient(90deg,#001325f0 0 35%,#0013258a 58%,#00132533);
  justify-items:start;
  padding-left:8vw
}

.intro-card {

}

.intro-kicker {

.intro-card>p {

.intro-card>button i {

  width:38px;
  height:38px;

.intro-card>button:hover i {

.intro-card>small {

.settings-overlay {

}

.settings-console {

  background:#eef2f4;
  border:1px solid #ffffffbf;

@keyframes consoleIn {

}

.settings-console header small {

.settings-console header strong {

}

.settings-console header>span {

}

.settings-body {

.settings-body nav {

.settings-body nav span,.settings-body nav b {

.settings-body nav b {

.door-settings {

.setting-title h2 {

.setting-option>span {

.setting-option strong,.setting-option small {

.setting-option strong {

.setting-option small {

.setting-option>i {

.setting-option.featured {

.setting-option.featured:hover {

.setting-option .radar-dot {

.switch {

.setting-confirm {

  background:#fff;
  width:min(390px,100vw - 40px);

.setting-confirm .confirm-icon {

  color:#fff;
  border-radius:50%;
  place-items:center;
  width:40px;
  height:40px;
  margin-bottom:21px;

  display:grid
}

.setting-confirm>small {

  letter-spacing:.15em;
  font-size:8px;
  font-weight:800
}

.setting-confirm h2 {
  letter-spacing:-.04em;
  margin:8px 0 12px;

}

.setting-confirm>p {

  line-height:1.7

.setting-confirm>div {

.setting-confirm footer {

.setting-confirm footer button {

  background:#fff;
  border:1px solid #cad4d9;
  height:47px;
  font-size:11px;
  font-weight:700
}

.setting-confirm footer button:last-child {

  color:#fff

.particle-field {
  z-index:17;
  pointer-events:none;
  position:absolute;
  top:0;
  bottom:0;
  left:0;
  right:0;
  overflow:hidden
}

.particle-field i {
  --angle:calc(var(--i) * 18deg);
  background:hsl(calc(170 + var(--i) * 7) 85% 62%);
  width:7px;
  height:18px;
  transform:translate(-50%,-50%) rotate(var(--angle));
  animation:1.4s ease-out forwards particleBurst;
  position:absolute;
  top:50%;
  left:50%
}

@keyframes particleBurst {
  to {
    transform:translate(-50%,-50%) rotate(var(--angle)) translateY(-42vh) rotate(260deg);
    opacity:0
  }

}

    transition-duration:.01ms!important;
    animation-duration:.01ms!important;

  }

}

/*

const VIDEO_SOURCE = "./sourcefilm.mp4";

const CARRIER_POSITIONS = {

    detected: { x: 23, y: 40 },

const COUNTDOWN_SECONDS = 3;
const COUNTDOWN_REAL_SECONDS = 6;

function carrierPosition(name) {
  const layout = window.matchMedia("(max-width: 760px)").matches ? "mobile" : "desktop";
  return { ...CARRIER_POSITIONS[layout][name] };
}

const STATUS_MESSAGES = {

const app = {

const root = document.querySelector("#root");

root.innerHTML = `

        <div class="mission-banner" hidden>

          <span class="status-glyph" data-status-icon></span>
          <div class="status-copy">
            <small data-status-code></small>

            <p data-status-detail></p>
          </div>
          <div class="status-metric">
            <small>POWER TAILGATE</small>
            <strong data-tailgate-state>READY</strong>
            <i class="status-progress"><b data-tailgate-progress></b></i>
          </div>
          <div class="clearance-countdown" role="timer" aria-live="assertive" aria-label="자동 재열림 카운트다운" hidden>
            <strong><span data-countdown-value>3</span></strong>
          </div>
        </div>

        <div class="stage-actions">
          <button class="open-button" type="button" data-action="open" hidden>
            <span>POWER TAILGATE</span><strong>테일게이트 열기</strong><i>→</i>
          </button>
          <button class="open-button retry" type="button" data-action="retry" hidden>
            <span>MISSION FAILED</span><strong>다시 도전하기</strong><i>↻</i>
          </button>
          <button class="open-button success-button" type="button" data-action="replay" hidden>
            <span>MISSION COMPLETE</span><strong>다시 체험하기</strong><i>↻</i>
          </button>
        </div>

      </section>
    </div>

    <div class="overlay-screen settings-overlay" role="dialog" aria-modal="true" aria-label="차량 설정" hidden>
      <section class="settings-console">
        <header>
          <button type="button" data-action="close-settings" aria-label="설정 닫기">←</button>
          <div><small>차량 설정</small><strong>도어</strong></div>
          <span>10:42</span>

        <div class="settings-body">

            <span>운전자 보조</span><span>시트</span><span>공조</span><b>도어</b><span>라이트</span>
          </nav>
          <div class="door-settings">
            <div class="setting-title"><small>DOOR SETTINGS</small><h2>테일게이트</h2></div>
            <div class="setting-option muted">
              <span>↗</span><div><strong>스마트 파워 테일게이트</strong><small>접근 시 자동 열림</small></div><i>›</i>
            </div>
            <button class="setting-option featured" type="button" data-action="show-confirm">
              <span class="radar-dot">◉</span>
              <div><strong>테일게이트 장애물 감지 보조</strong><small>출고 시 기본 OFF</small></div>
              <i class="switch"><b></b></i>
            </button>
            <p class="setting-help"><b>i</b> 파워 테일게이트 열림 중 후방·천장 장애물을 감지하면 자동으로 멈춥니다.</p>
          </div>
        </div>
      </section>

      <section class="setting-confirm" role="alertdialog" aria-modal="true" hidden>
        <span class="confirm-icon">!</span>
        <small>기능 활성화</small>
        <h2>감지 보조를 켤까요?</h2>
        <p>레이더 센서가 테일게이트 열림 영역을 감지합니다. 주변 안전을 직접 확인한 후 사용하세요.</p>
        <div><span>✓ 충돌 위험 시 자동 정지</span><span>✓ 안전 확인 시 자동 재열림</span></div>
        <footer>
          <button type="button" data-action="hide-confirm">취소</button>
          <button type="button" data-action="activate">확인하고 켜기</button>
        </footer>

const elements = {
  shell: root.querySelector(".game-shell"),
  stage: root.querySelector("[data-stage]"),
  video: root.querySelector(".game-video"),
  radarZone: root.querySelector(".radar-zone"),
  banner: root.querySelector(".mission-banner"),
  status: root.querySelector(".status-toast"),
  countdown: root.querySelector(".clearance-countdown"),
  countdownValue: root.querySelector("[data-countdown-value]"),
  obstacle: root.querySelector(".drag-obstacle"),
  dragPulse: root.querySelector(".drag-pulse"),
  dragLabel: root.querySelector(".drag-label"),
  particleField: root.querySelector(".particle-field"),
  intro: root.querySelector(".intro-overlay"),
  settings: root.querySelector(".settings-overlay"),
  confirm: root.querySelector(".setting-confirm"),
  openButton: root.querySelector('[data-action="open"]'),
  retryButton: root.querySelector('[data-action="retry"]'),
  replayButton: root.querySelector('[data-action="replay"]'),
};

function objectGraphicMarkup(type) {
  if (type === "cart") {
    return "<i></i><span></span><b></b><b></b>";
  }

  if (type === "luggage") {
    return "<i></i><span></span><b></b><b></b>";
  }

  return "<i></i><span>H</span>";
}

function renderObjectGraphic(holder, type) {
  holder.className = `${type}-graphic`;
  holder.innerHTML = objectGraphicMarkup(type);
}

function setHidden(element, shouldHide) {
  element.hidden = shouldHide;
}

function isActiveMovement() {
  return ["opening", "stopped", "reopening"].includes(app.phase);
}

function isExperienceVisible() {
  return !["intro", "settings"].includes(app.phase);
}

function setPhase(nextPhase) {
  clearStopCountdown();
  app.phase = nextPhase;
  updateInterface();

  if (nextPhase === "stopped" && !app.countdownExpired) {
    startStopCountdown();
  }
}

function updateInterface() {
  const phase = app.phase;
  const experienceVisible = isExperienceVisible();
  const movementActive = isActiveMovement();
  const obstacleDetected = phase === "stopped" && app.obstacleInside;

  elements.shell.className = `game-shell phase-${phase}${obstacleDetected ? " obstacle-inside" : ""}`;
  setHidden(elements.intro, phase !== "intro");
  setHidden(elements.settings, phase !== "settings");
  setHidden(elements.obstacle, !experienceVisible);
  setHidden(elements.banner, !experienceVisible);
  setHidden(elements.status, !STATUS_MESSAGES[phase]);
  setHidden(elements.countdown, phase !== "stopped");
  setHidden(elements.openButton, phase !== "armed");
  setHidden(elements.retryButton, phase !== "missed");
  setHidden(elements.replayButton, phase !== "success");
  setHidden(elements.particleField, phase !== "success");
  setHidden(elements.dragPulse, !(phase === "stopped" && !app.countdownExpired));

  elements.radarZone.classList.toggle("visible", movementActive);
  updateBanner();
  updateStatus();
  updateCountdown();
  updateTelemetry();
  updateObjectControls();
  updateProgress();
}

function updateBanner() {
  const message = app.phase === "stopped" && app.countdownExpired
    ? ["TIME OUT", "제한 시간이 지나 테일게이트가 정지 상태를 유지합니다"]
    : MISSION_BANNERS[app.phase] || [];
  const [code = "", text = ""] = message;
  elements.banner.className = `mission-banner ${app.phase}`;
  root.querySelector("[data-banner-code]").textContent = code;
  root.querySelector("[data-banner-text]").textContent = text;
}

function updateStatus() {
  const status = app.phase === "stopped" && app.countdownExpired
    ? {
        code: "TAILGATE HOLD",
        title: "3초 제한 시간 초과",
        detail: "캐리어를 옮겨도 테일게이트는 정지 상태를 유지합니다",
        tone: "missed",
        icon: "!",
      }
    : STATUS_MESSAGES[app.phase];
  if (!status) return;

  elements.status.className = `status-toast ${status.tone}`;
  root.querySelector("[data-status-icon]").textContent = status.icon;
  root.querySelector("[data-status-code]").textContent = status.code;
  root.querySelector("[data-status-title]").textContent = status.title;
  root.querySelector("[data-status-detail]").textContent = status.detail;
}

function updateCountdown() {
  if (app.phase !== "stopped") return;

  const remaining = Math.max(0, app.countdownRemaining);
  elements.countdown.classList.toggle("expired", app.countdownExpired);
  elements.countdownValue.textContent = app.countdownExpired
    ? "0"
    : String(Math.max(1, Math.ceil(remaining)));
}

function updateTelemetry() {
  const tailgateStates = {
    opening: "OPENING",
    stopped: "PAUSED",
    reopening: "REOPENING",
    success: "OPEN",
  };

  root.querySelector("[data-tailgate-state]").textContent = tailgateStates[app.phase] || "READY";
}

function updateObjectControls() {
  const canDrag = ["stopped", "reopening"].includes(app.phase);
  renderObjectGraphic(root.querySelector("[data-drag-graphic]"), "luggage");

  elements.obstacle.className = `drag-obstacle luggage${canDrag ? "" : " locked"}`;
  elements.obstacle.style.left = `${app.position.x}%`;
  elements.obstacle.style.top = `${app.position.y}%`;
  elements.obstacle.setAttribute(
    "aria-label",
    "캐리어 드래그. 방향키로도 이동 가능",
  );
  const labels = {
    armed: "CARRIER",
    opening: "SCANNING",
    stopped: app.countdownExpired ? "TIME OUT" : "MOVE NOW",
    reopening: "DRAG TO TEST",
    success: "COMPLETE",
  };
  elements.dragLabel.textContent = labels[app.phase] || "CARRIER";
}

function updateProgress() {
  const width = `${app.progress}%`;
  root.querySelector("[data-tailgate-progress]").style.width = width;
  root.querySelector("[data-timeline]").style.width = width;
  root.querySelector("[data-timeline-handle]").style.left = width;
}

function updateObstaclePosition() {
  elements.obstacle.style.left = `${app.position.x}%`;
  elements.obstacle.style.top = `${app.position.y}%`;
}

function positionIsInsideRadar(position) {
  const stageBounds = elements.stage.getBoundingClientRect();
  const radarBounds = elements.radarZone.getBoundingClientRect();

  if (!stageBounds.width || !stageBounds.height || !radarBounds.width || !radarBounds.height) {
    return false;
  }

  const obstacleCenterX = stageBounds.left + (position.x / 100) * stageBounds.width;
  const obstacleCenterY = stageBounds.top + (position.y / 100) * stageBounds.height;

  return (
    obstacleCenterX >= radarBounds.left &&
    obstacleCenterX <= radarBounds.right &&
    obstacleCenterY >= radarBounds.top &&
    obstacleCenterY <= radarBounds.bottom
  );
}

function moveObstacle(position) {
  app.position = {
    x: Math.max(5, Math.min(94, position.x)),
    y: Math.max(15, Math.min(88, position.y)),
  };
  app.hasDragged = true;
  updateObstaclePosition();
  setHidden(elements.dragPulse, true);

  const isInside = positionIsInsideRadar(app.position);
  if (isInside !== app.obstacleInside) {
    handleObstacleChange(isInside);
  }
}

function handleObstacleChange(isInside) {
  app.obstacleInside = isInside;

  if (isInside && app.phase === "reopening") {
    stopForObstacle();
    return;
  }

  if (!isInside && app.phase === "stopped") {
    const movedInTime = !app.countdownExpired && performance.now() < app.stopDeadline;
    if (movedInTime) {
      resumeTailgate();
    } else {
      app.countdownExpired = true;
      app.countdownRemaining = 0;
      updateInterface();
    }
    return;
  }

  updateInterface();
}

function stopForObstacle() {
  elements.video.pause();
  app.stopCount += 1;
  app.countdownRemaining = COUNTDOWN_SECONDS;
  app.countdownExpired = false;
  app.stopDeadline = performance.now() + COUNTDOWN_REAL_SECONDS * 1000;

  if (!app.detectedOnce) {
    app.detectedOnce = true;
    app.score += 350;
  }

  playTone(190, 0.26, "sawtooth");
  window.setTimeout(() => playTone(145, 0.2, "square"), 90);
  setPhase("stopped");
}

function resumeTailgate() {
  app.score += 200;
  playTone(760, 0.13);
  setPhase("reopening");
  elements.video.play().catch(handleVideoError);
}

function startStopCountdown() {
  clearStopCountdown();
  app.countdownTimer = window.setInterval(() => {
    const realSecondsRemaining = Math.max(0, (app.stopDeadline - performance.now()) / 1000);
    app.countdownRemaining = realSecondsRemaining * (COUNTDOWN_SECONDS / COUNTDOWN_REAL_SECONDS);

    if (app.countdownRemaining <= 0) {
      app.countdownRemaining = 0;
      app.countdownExpired = true;
      clearStopCountdown();
      updateInterface();
      return;
    }

    updateCountdown();
    updateStatus();
  }, 50);
}

function clearStopCountdown() {
  if (app.countdownTimer) window.clearInterval(app.countdownTimer);
  app.countdownTimer = null;
}

function startExperience() {
  setPhase("settings");
}

function activateFeature() {
  setHidden(elements.confirm, true);
  app.score = 200;
  playTone(660, 0.1);
  window.setTimeout(() => playTone(880, 0.12), 100);
  setPhase("armed");
}

function launchCarrier() {
  const openingToDetectionSeconds = Number.isFinite(elements.video.duration)
    ? elements.video.duration * 0.1
    : 0.8;
  const flightDuration = Math.max(500, openingToDetectionSeconds * 1000);

  elements.obstacle.style.setProperty("--carrier-flight-duration", `${flightDuration}ms`);
  elements.obstacle.classList.add("carrier-flying");
  void elements.obstacle.offsetWidth;

  window.requestAnimationFrame(() => {
    if (app.phase !== "opening") return;
    app.position = carrierPosition("detected");
    app.obstacleInside = true;
    updateObstaclePosition();
  });
}

function openTailgate() {
  resetAttemptState();
  app.score = 200;
  app.startedAt = performance.now();
  startElapsedTimer();
  elements.video.currentTime = 0;
  elements.video.muted = true;
  playTone(520, 0.08);
  setPhase("opening");
  launchCarrier();
  elements.video.play().catch(handleVideoError);
}

function retryExperience() {
  resetAttemptState();
  app.score = 200;
  elements.video.pause();
  elements.video.currentTime = 0;
  setPhase("armed");
}

function resetAttemptState() {
  clearStopCountdown();
  stopElapsedTimer();
  app.position = carrierPosition("start");
  app.obstacleInside = false;
  app.hasDragged = false;
  app.countdownRemaining = COUNTDOWN_SECONDS;
  app.countdownExpired = false;
  app.stopDeadline = 0;
  app.initialDetectionTriggered = false;
  app.progress = 0;
  app.stopCount = 0;
  app.detectedOnce = false;
  app.elapsed = 0;
}

function returnHome() {
  elements.video.pause();
  elements.video.currentTime = 0;
  resetAttemptState();
  app.score = 0;
  setHidden(elements.confirm, true);
  setPhase("intro");
}

function startElapsedTimer() {
  stopElapsedTimer();
  app.elapsedTimer = window.setInterval(() => {
    if (!isActiveMovement()) return;
    app.elapsed = (performance.now() - app.startedAt) / 1000;
  }, 100);
}

function stopElapsedTimer() {
  if (app.elapsedTimer) window.clearInterval(app.elapsedTimer);
  app.elapsedTimer = null;
}

function updateVideoProgress() {
  if (!Number.isFinite(elements.video.duration) || elements.video.duration === 0) return;
  app.progress = (elements.video.currentTime / elements.video.duration) * 100;

  if (app.phase === "opening" && !app.initialDetectionTriggered && app.progress >= 10) {
    app.initialDetectionTriggered = true;
    app.progress = 10;
    elements.video.currentTime = elements.video.duration * 0.1;
    updateProgress();
    stopForObstacle();
    return;
  }

  updateProgress();
}

function finishVideo() {
  app.progress = 100;
  app.elapsed = app.startedAt ? (performance.now() - app.startedAt) / 1000 : app.elapsed;
  stopElapsedTimer();

  if (app.detectedOnce) {
    app.score += Math.max(100, 250 - Math.floor(app.elapsed * 8));
    playTone(660, 0.12);
    window.setTimeout(() => playTone(880, 0.14), 120);
    window.setTimeout(() => playTone(1100, 0.2), 250);
    setPhase("success");
  } else {
    playTone(180, 0.25, "triangle");
    setPhase("missed");
  }
}

function handleVideoError(error) {
  console.warn("영상을 재생하지 못했습니다. 소스 파일 경로를 확인하세요.", error);
}

function playTone(frequency, duration = 0.1, type = "sine") {
  if (!app.soundOn) return;

  try {
    app.audioContext ||= new window.AudioContext();
    const oscillator = app.audioContext.createOscillator();
    const gain = app.audioContext.createGain();
    oscillator.type = type;
    oscillator.frequency.value = frequency;
    gain.gain.setValueAtTime(0.055, app.audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, app.audioContext.currentTime + duration);
    oscillator.connect(gain).connect(app.audioContext.destination);
    oscillator.start();
    oscillator.stop(app.audioContext.currentTime + duration);
  } catch (error) {
    console.debug("효과음을 재생할 수 없습니다.", error);
  }
}

function pointerPosition(event) {
  const bounds = elements.stage.getBoundingClientRect();
  return {
    x: ((event.clientX - bounds.left) / bounds.width) * 100,
    y: ((event.clientY - bounds.top) / bounds.height) * 100,
  };
}

elements.obstacle.addEventListener("pointerdown", (event) => {
  if (!["stopped", "reopening"].includes(app.phase)) return;
  app.dragging = true;
  event.currentTarget.setPointerCapture(event.pointerId);
  moveObstacle(pointerPosition(event));
});

elements.obstacle.addEventListener("pointermove", (event) => {
  if (app.dragging) moveObstacle(pointerPosition(event));
});

function stopDragging(event) {
  app.dragging = false;
  if (event.currentTarget.hasPointerCapture(event.pointerId)) {
    event.currentTarget.releasePointerCapture(event.pointerId);
  }
}

elements.obstacle.addEventListener("pointerup", stopDragging);
elements.obstacle.addEventListener("pointercancel", stopDragging);

elements.obstacle.addEventListener("keydown", (event) => {
  if (!["stopped", "reopening"].includes(app.phase)) return;

  const movements = {
    ArrowLeft: { x: -3, y: 0 },
    ArrowRight: { x: 3, y: 0 },
    ArrowUp: { x: 0, y: -3 },
    ArrowDown: { x: 0, y: 3 },
  };
  const movement = movements[event.key];
  if (!movement) return;

  event.preventDefault();
  moveObstacle({
    x: app.position.x + movement.x,
    y: app.position.y + movement.y,
  });
});

root.querySelector('[data-action="start"]').addEventListener("click", startExperience);
root.querySelector('[data-action="close-settings"]').addEventListener("click", () => setPhase("intro"));
root.querySelector('[data-action="show-confirm"]').addEventListener("click", () => setHidden(elements.confirm, false));
root.querySelector('[data-action="hide-confirm"]').addEventListener("click", () => setHidden(elements.confirm, true));
root.querySelector('[data-action="activate"]').addEventListener("click", activateFeature);
elements.openButton.addEventListener("click", openTailgate);
elements.retryButton.addEventListener("click", retryExperience);
elements.replayButton.addEventListener("click", retryExperience);
root.querySelector('[data-action="home"]').addEventListener("click", returnHome);

elements.video.addEventListener("timeupdate", updateVideoProgress);
elements.video.addEventListener("ended", finishVideo);

updateInterface();
    </script>
  </body>
</html>
